/* ---------- 男主回應語（REACT）＋情境劇場 ---------- */
function reactPool(p,k){const r=typeof REACT!=='undefined'&&REACT[p.id]&&REACT[p.id][k];let own=p===PS?plines(PS,k):p[k];own=Array.isArray(own)?own.filter(Boolean):[];
  if(r)return r.concat(own);if(own.length)return own;return (typeof REACT!=='undefined'&&REACT.senior[k])||PERSONAS[0][k]||['']}
function sayLine(p,k,used,extra){const pool=reactPool(p,k);let c=pool.filter(x=>!used||!used.has(x));if(!c.length){c=pool;if(used)used.clear()}const l=pick(c);if(used)used.add(l);
  return fill(String(l).replace(/\{main\}/g,(extra&&extra.main)||PS.name),p)}
function gradeLine(it){const p=it.voice||PS;sess.used=sess.used||new Set();let k;
  if(it.right){sess.streak=(sess.streak||0)+1;k=sess.prevWrong?'back':(sess.streak>=3&&sess.streak%3===0?'streak':'ok');sess.prevWrong=0}
  else{sess.streak=0;k=sess.prevWrong>=1?'ng2':'ng';sess.prevWrong=(sess.prevWrong||0)+1}
  return sayLine(p,k,sess.used)}
const SCN_CH=10;
const sceneMeta=bid=>(typeof SCENE_META!=='undefined'&&SCENE_META[bid])||null;
function sceneList(bid){return (PREM&&PREM.scenes&&PREM.scenes[bid])||(typeof SCENES!=='undefined'&&SCENES[bid])||[]}
function sceneTotal(bid){const m=sceneMeta(bid);return m?m.total:0}
const sceneFree=bid=>(typeof SCENES!=='undefined'&&SCENES[bid]||[]).length;
const chapterCount=bid=>Math.ceil(sceneTotal(bid)/SCN_CH);
const chapterTitle=(bid,c)=>{const m=sceneMeta(bid);return (m&&m.chapters[c])||('第 '+(c+1)+' 章')};
const chapterLocked=(bid,c)=>(c+1)*SCN_CH>sceneList(bid).length;
const scnDone=bid=>P.scn[bid]||{};
function chapterProg(bid,c){const d=scnDone(bid);let n=0;for(let k=c*SCN_CH;k<Math.min((c+1)*SCN_CH,sceneTotal(bid));k++)if(k in d)n++;return n}
function nextChapter(bid){const n=chapterCount(bid);for(let c=0;c<n;c++)if(chapterProg(bid,c)<Math.min(SCN_CH,sceneTotal(bid)-c*SCN_CH))return c;return 0}
function voiceFor(k){const others=PERSONAS.filter(p=>p.id!==PS.id).map(p=>getPersona(p.id)||p);if(k%SCN_CH!==SCN_CH-1||!others.length)return {p:PS,cameo:false};return {p:others[(k*7+3)%others.length],cameo:true}}
function sceneQ(bid,k){const s=sceneList(bid)[k];if(!s)return null;let q;
  if(s.r){const base=qById(s.r);if(!base)return null;q={...base}}
  else q={id:'sc:'+bid+':'+(k+1),t:s.o&&s.o.length?'mc':'tf',q:s.q,o:s.o||[],a:s.a,e:s.e||''};
  const v=voiceFor(k);q.sc={k,text:s.s,p:v.p,cameo:v.cameo,ci:s.ci||'',co:s.co||''};return q}
function startChapter(c){const bid=B.id;if(chapterLocked(bid,c)){openPaywall('scene');return}
  const qs=[];for(let k=c*SCN_CH;k<Math.min((c+1)*SCN_CH,sceneTotal(bid));k++){const q=sceneQ(bid,k);if(q)qs.push(q)}
  if(!qs.length){toast('這一章還沒有內容');return}

  startChapter.skip=false;
  startSession({kind:'scene',chapter:c,title:`第 ${c+1} 章・${chapterTitle(bid,c)}`,qs,nav:false,from:'scenes'});
  sess.items.forEach(it=>{it.voice=it.q.sc.p})}
function sceneHTML(q){const sc=q.sc,p=sc.p;const paras=parseText(sc.text,p);
  if(!sc.ask)sc.ask=sc.cameo?sayLine(p,'cameo',null):sayLine(p,'ask',sess&&(sess.usedAsk=sess.usedAsk||new Set()));
  return `<div class="scene"><div class="who">${avHTML(p,'','ask')}<span><b>${esc(p.name)}</b><small>${esc(p.type)}${sc.cameo?'・客串登場':''}</small></span></div>

   <p class="scene-ask">「${esc(sc.ask)}」</p></div>`}

/* ---------- 作答 session ---------- */
let sess=null,timerId=null;
function wordQ(t,rev,pool,sid){const others=shuffle(pool.filter(o=>norm(o[0])!==norm(t[0])&&o[1]!==t[1])).slice(0,3);if(others.length<3)return null;
  const s=storyById(sid||(allTerms()[norm(t[0])]||{}).sid);
  return {id:'w:'+norm(t[0]),syn:true,rev,t:'mc',q:rev?t[1]:t[0],o:[rev?t[0]:t[1],...others.map(o=>rev?o[0]:o[1])],a:0,e:`${t[0]}：${t[1]}${s?'　出自《'+s.title+'》':''}`,w:t[0],g:t[1],sid:s?s.id:''}}
function wordQs(terms,n){const pool=termPool();return shuffle(terms.slice()).slice(0,n).map((t,i)=>wordQ(t,i%3===2,pool)).filter(Boolean)}
function readTerms(){const ids=Object.keys(P.read);const ts=Object.values(allTerms()).filter(t=>ids.includes(t.sid)).map(t=>[t.w,t.g]);return ts.length>=6?ts:termPool()}
function mkItem(q){const n=q.t==='tf'?2:q.o.length;const ord=[...Array(n).keys()];if(q.t!=='tf'&&(q.syn||B.shuffle!==false))shuffle(ord);return {q,ord,pick:null,graded:false,right:false}}
function startSession(o){stopTimer();sess={i:0,score:0,done:false,start:Date.now(),instant:true,nav:true,coach:true,limit:0,...o,items:o.qs.map(mkItem)};delete sess.qs;
  if(sess.limit)sess.deadline=Date.now()+sess.limit*1000;go('run',{from:o.from||'list'});if(sess.limit)startTimer()}
function startUnit(id,mode){const qs=unitQs(id);if(!qs.length){toast('這個單元還沒有題目');return}P.last={k:'u',id};saveP('last');
  startSession({kind:'unit',unit:id,title:unitOf(id).title,qs:qs.slice(),instant:mode!=='test',mode:mode||'learn',from:state.from||'list'})}
function startStoryQuiz(sid){const s=storyById(sid);const qs=wordQs(storyWords(s),10);if(qs.length<3){toast('這篇故事的重點詞太少，至少需要 4 個');return}
  startSession({kind:'story',sid,title:'讀完挑戰・'+s.title,qs,nav:false,from:state.from||'list'})}
function startReview(kind){
  if(kind==='words'){const ws=Object.values(P.words).map(w=>[w.w,w.g]);if(!ws.length){toast('生字本是空的');return}const qs=wordQs(ws,20);if(!qs.length){toast('重點詞不足，無法出題');return}
    startSession({kind:'words',title:'生字本複習',qs,nav:false,from:'book'});return}
  const ids=Object.keys(kind==='fav'?P.fav:P.wrong).filter(qById);if(!ids.length){toast(kind==='fav'?'收藏是空的':'錯題本是空的，太棒了！');return}
  startSession({kind:kind==='fav'?'fav':'review',title:kind==='fav'?'收藏題重練':'錯題重練',qs:shuffle(ids.map(qById)).slice(0,20),from:'book'})}
function mixQs(n){const half=Math.ceil(n/2);const w=termPool().length>=4?wordQs(readTerms(),half):[];const q=shuffle(B.qs.slice()).slice(0,n-w.length);return shuffle(w.concat(q))}
function startDaily(){const qs=mixQs(10);if(qs.length<4){toast('題目或重點詞至少要 4 個才能挑戰');return}
  startSession({kind:'daily',title:'每日 10 題挑戰',qs,nav:false,from:'games'})}

  startSession({kind:'exam',title:'模擬考',qs:shuffle(B.qs.slice()).slice(0,n),instant:false,coach:false,limit:(B.exam.min||0)*60,from:'games'})}
function startSprint(){let pool=[];const base=B.qs.slice();for(let i=0;i<8;i++)pool=pool.concat(shuffle(base.concat(termPool().length>=4?wordQs(termPool(),30):[])));if(pool.length<4){toast('題目不足');return}
  startSession({kind:'sprint',title:'60 秒快答',qs:pool.slice(0,200),nav:false,coach:false,limit:60,from:'games'})}
const cur=()=>sess.items[sess.i];
function grade(it){if(it.graded)return;it.graded=true;it.right=it.pick===it.q.a;if(it.pick!=null)record(it.q,it.right);if(it.right)sess.score++;
  if(sess.kind==='review'&&it.right&&P.wrong[it.q.id]){delete P.wrong[it.q.id];saveP('wrong');it.cleared=true}
  it.line=sess.coach?gradeLine(it):'';
  if(sess.kind==='scene'&&it.q.sc){const d=P.scn[B.id]=P.scn[B.id]||{};d[it.q.sc.k]=it.right?1:0;saveP('scn')}}
function startTimer(){stopTimer();timerId=setInterval(()=>{if(!sess||sess.done){stopTimer();return}const left=Math.max(0,Math.ceil((sess.deadline-Date.now())/1000));
  const el=$('#timer');if(el){el.textContent=fmtTime(left);el.classList.toggle('low',left<=10)}if(left<=0){stopTimer();if(sess.kind==='exam')toast('時間到，自動交卷');finish()}},250)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
const fmtTime=s=>Math.floor(s/60)+':'+pad2(s%60);
function finish(){if(!sess||sess.done)return;stopTimer();if(!sess.instant)sess.items.forEach(grade);sess.done=true;sess.end=Date.now();
  const items=sess.kind==='sprint'?sess.items.filter(x=>x.graded):sess.items;sess.total=items.length;sess.items=items;
  if(sess.kind==='unit'){const first=!P.done[sess.unit];P.done[sess.unit]=Date.now();P.best[sess.unit]={c:sess.score,n:sess.total};saveP('done','best');logDay('u:'+sess.unit);if(first)P.xp+=20}
  else if(sess.kind==='story'){P.xp+=10;if(!P.read[sess.sid]){P.read[sess.sid]=Date.now();saveP('read');logDay('s:'+sess.sid)}}
  else if(sess.kind==='daily'||sess.kind==='exam'){const k=dkey();const rec=P.quiz[k]||{};rec[sess.kind]=Math.max(rec[sess.kind]||0,sess.score);P.quiz[k]=rec;P.xp+=sess.score*5;saveP('quiz');logDay(sess.kind)}
  else if(sess.kind==='sprint'){sess.newBest=sess.score>P.sprint;if(sess.newBest){P.sprint=sess.score;saveP('sprint')}P.xp+=sess.score*3;logDay('sprint')}
  else logDay(sess.kind);
  saveP('xp');go('end',{from:sess.from})}

  let r;try{r=await fetch(apiBase()+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body||{})})}catch(e){const er=new Error('net');er.kind='net';throw er}

function apiErrText(e){if(e.kind==='http'){if(e.status===401||e.status===403)return '金鑰（key）不正確：請確認 config 裡的 key 是 Publishable key（sb_publishable_ 開頭）或 anon public key，不是 secret。';

    return '伺服器回應錯誤（'+e.status+'）'+(e.msg?'：'+e.msg:'')}
  if(location.hostname.endsWith('claude.ai')||location.hostname.endsWith('claudeusercontent.com'))return '這個預覽頁面無法連線到外部伺服器，請到你自己的 GitHub 網址測試。';

function withPrem(b){if(!b||!b.builtin||!PREM||!PREM.stories||!PREM.stories[b.id])return b;b.stories=b.stories.map(s=>{if(!s.paid)return s;const f=premStory(b.id,s.id);return f?{...f}:s});return b}

async function tryUnlock(){if(unlocking)return;const el=$('#ucode'),er=$('#uerr'),bt=$('[data-unlock]');const c=(el&&el.value||'').trim();if(!c){er.textContent='請輸入解鎖碼';return}

/* 作答 */
VIEWS.run=function(){if(!sess){go('list');return}const it=cur(),q=it.q;
  const showRes=sess.instant&&it.graded;const total=sess.kind==='sprint'?null:sess.items.length;const fav=!q.syn&&!!P.fav[q.id];
  const opts=it.ord.map((oi,j)=>{let c='opt';if(showRes){if(oi===q.a)c+=' ok';else if(oi===it.pick)c+=' ng'}else if(oi===it.pick)c+=' sel';
    return `<button class="${c}" data-opt="${j}"${showRes?' disabled':''}>${q.t==='tf'?'':`<span class="k">${KEYS[j]}</span>`}<span${q.syn&&q.rev&&isLatin(optText(q,oi))?' style="font-family:var(--f-en);font-size:17px"':''}>${esc(optText(q,oi))}</span></button>`}).join('');
  let fb='';if(showRes){fb=(it.line?`<div class="coach">${avHTML(it.voice||PS,'',it.right?'ok':'ng')}<p>「${esc(it.line)}」<small>${esc((it.voice||PS).name)}・${esc((it.voice||PS).type)}</small></p></div>`:'')+
      `<div class="exp ${it.right?'okb':'ngb'}"><b>${it.right?'✓ 答對了':'✕ 正解：'+esc(optText(q,q.a))}${it.cleared?'・已移出錯題本':''}${q.syn&&!it.right?'・已收進生字本':''}</b>${esc(q.e||'')}${qSrc(q)}</div>`}
  const last=sess.i>=sess.items.length-1;const pct=total?((sess.i+(it.graded||it.pick!=null?1:0))/total*100):0;
  let nav='';
  if(sess.kind==='sprint')nav='';
  else if(sess.instant)nav=`<div class="qnav">${sess.nav&&sess.i>0?'<button class="btn ghost" data-prev>上一題</button>':''}${it.graded?(last?'<button class="btn" data-finish>看成績</button>':'<button class="btn" data-next>下一題</button>'):(sess.nav&&!last?'<button class="btn ghost" data-next>略過</button>':'')}</div>`;
  else{const answered=sess.items.filter(x=>x.pick!=null).length;nav=`<div class="qnav">${sess.i>0?'<button class="btn ghost" data-prev>上一題</button>':''}${last?'':'<button class="btn" data-next>下一題</button>'}</div><button class="btn${last?'':' ghost'} block" data-submit>交卷（已答 ${answered}/${total}）</button>`}
  const dots=sess.nav&&total&&total<=60?`<div class="dots">${sess.items.map((x,k)=>{let c='';if(sess.instant&&x.graded)c=x.right?'okd':'ngd';else if(x.pick!=null)c='ans';return `<button class="${c}${k===sess.i?' cur':''}" data-jump="${k}">${k+1}</button>`}).join('')}</div>`:'';
  const prompt=q.syn?(q.rev?'選出正確的詞':'這個詞是什麼意思？'):'';
  app.innerHTML=`<div class="view">
   <div class="readbar"><button class="iconbtn" data-quit aria-label="離開">${ICON.back}</button><span class="t">${esc(sess.title)}</span>
     ${sess.limit?`<span class="timer" id="timer">${fmtTime(Math.max(0,Math.ceil((sess.deadline-Date.now())/1000)))}</span>`:''}
     <span class="fontctl"><button class="iconbtn" data-font="-1" aria-label="字變小">A-</button><button class="iconbtn" data-font="1" aria-label="字變大">A+</button></span>
     <div class="progress"><i style="width:${pct}%"></i></div></div>
   <div class="qcard">
     <div class="qmeta"><span class="kind">${kindLabel(q)}</span><span>${sess.kind==='sprint'?`答對 ${sess.score} 題`:`第 ${sess.i+1} / ${total} 題`}</span><span class="sp"></span>
       ${B.lang?`<button class="iconbtn" data-speakt="${esc(q.syn?q.w:q.q)}" aria-label="朗讀">${ICON.speak}</button>`:''}
       ${q.syn?'':`<button class="iconbtn" data-fav="${esc(q.id)}" aria-pressed="${fav}" aria-label="收藏">${fav?ICON.saved:ICON.save}</button>`}</div>
     ${q.sc?sceneHTML(q):''}
     ${prompt?`<span class="muted" style="text-align:center;font-size:13px">${prompt}</span>`:''}
     <div class="qtext${q.syn?' big gt':isLatin(q.q)?' en':''}">${esc(q.q)}</div>
     ${qMedia(q)}
     <div class="opts${q.t==='tf'?' tf':''}">${opts}</div>
     ${fb}
   </div>
   ${nav}${dots}
   ${state.confirmQuit?`<div class="confirm"><b>確定要離開嗎？</b><span>這一回不會計入成績（已答的錯題仍會收進錯題本／生字本）。</span><div class="acts"><button class="btn sm" data-quityes>離開</button><button class="btn ghost sm" data-quitno>繼續作答</button></div></div>`:''}
  </div>`};

   ${s.total?`<section class="blk"><div class="section-h"><h3>逐題檢討</h3><span class="muted" style="font-size:13px">錯 ${wrongs.length} 題${wrongs.some(x=>x.pick!=null)?'・已自動收集':''}</span></div>
     <div class="list">${s.items.map((x,k)=>`<button class="qrow" ${x.q.syn?`data-wsheet="${esc(norm(x.q.w))}"`:`data-qsheet="${esc(x.q.id)}" data-yours="${x.pick==null?'':x.pick}"`}><span class="qt">${x.right?'✓':'✕'} ${k+1}. ${esc(x.q.q)}</span><small>${x.right?'答對':x.pick==null?'未作答':'你的答案：'+esc(optText(x.q,x.pick))}・正解：${esc(optText(x.q,x.q.a))}</small></button>`).join('')}</div></section>`:''}
   <div class="acts">
     ${s.kind==='scene'&&s.chapter+1<chapterCount(B.id)?`<button class="btn" data-chapter="${s.chapter+1}">下一章：${esc(chapterTitle(B.id,s.chapter+1))}${chapterLocked(B.id,s.chapter+1)?' 🔒':''}</button>`:''}
     ${nextS?`<button class="btn" data-sintro="${esc(nextS.id)}" data-from="list">下一篇：${esc(nextS.title)}</button>`:''}

/* 進度 */
let calOff=0;

  const us=usableUnits(),nDone=us.filter(u=>P.done[u.id]).length,ans=answeredCount(),acc=accuracy(),st=streak();
  const today=new Date(),cm=new Date(today.getFullYear(),today.getMonth()+calOff,1),mEnd=new Date(cm.getFullYear(),cm.getMonth()+1,0);

     <div class="cal">${cal}</div><span class="muted" style="font-size:12.5px">讀完一篇、完成一個單元或一回挑戰的日子會亮起（所有題庫共用）。</span></section>
   ${us.length?`<section class="blk"><h3>各單元正確率</h3>${us.map(u=>{const a=accuracy(unitQs(u.id));return `<div class="ubar"><div><div class="barrow"><span>${esc(u.title)}</span></div><div class="bar"><i style="width:${a||0}%"></i></div></div><span class="muted" style="text-align:right">${a==null?'未作答':a+'%'}</span></div>`}).join('')}</section>`:''}
   <section class="blk"><div class="section-h"><h3>讀過的故事</h3><span class="muted" style="font-size:13px">${hist.length} 篇</span></div>

function rankCard(){const lv=level(P.xp);const span=lv.next?lv.next-lv.cur:1,prog=lv.next?Math.round((P.xp-lv.cur)/span*100):100;

/* 生字本 / 錯題 / 收藏 */
VIEWS.book=function(){const tab=state.tab||'words';
  const ws=Object.entries(P.words).sort((a,b)=>b[1].t-a[1].t);
  const wrongIds=Object.keys(P.wrong).filter(qById).sort((a,b)=>P.wrong[b]-P.wrong[a]),favIds=Object.keys(P.fav).filter(qById).sort((a,b)=>P.fav[b]-P.fav[a]);

     <div class="list">${ws.map(([k,w])=>{const s=storyById(w.sid);return `<div class="wbrow"><button class="main" data-wsheet="${esc(k)}"><span class="en"${isCJK(w.w)?' style="font-family:var(--f-display)"':''}>${esc(w.w)}</span><span class="zh">${esc(w.g)}</span>${s?`<span class="from">《${esc(s.title)}》</span>`:''}</button><button class="save" data-wsave="${esc(k)}" aria-pressed="true" aria-label="移出生字本">${ICON.saved}</button></div>`}).join('')}</div>`
     :'<p class="empty">生字本是空的。讀故事時點金色的字，再按書籤就能收藏；讀完挑戰答錯的詞也會自動收進來。</p>';
  else{const ids=tab==='wrong'?wrongIds:favIds;body=ids.length?`<button class="btn block" data-review="${tab}">${tab==='wrong'?'開始錯題重練':'重練收藏題'}（最多 20 題）</button>

/* 配對連連看 */
let mt=null;
function matchPairs(){const ts=readTerms().filter(t=>t[0].length<=24&&t[1].length<=22);if(ts.length>=4)return ts;
  return B.qs.filter(q=>!q.img&&!q.url&&!/A|B|C|以上皆/.test(q.o.join(''))&&q.t!=='tf'&&q.q.length<=60&&String(q.o[q.a]).length<=24).map(q=>[q.q,q.o[q.a]])}
function startMatch(){const ps=[];const seenA=new Set(),seenB=new Set();for(const t of shuffle(matchPairs().slice())){if(seenA.has(norm(t[0]))||seenB.has(t[1]))continue;seenA.add(norm(t[0]));seenB.add(t[1]);ps.push(t);if(ps.length>=6)break}
  if(ps.length<4){toast('可配對的內容不足');return}mt={ps,left:shuffle(ps.map((_,i)=>i)),right:shuffle(ps.map((_,i)=>i)),sel:null,ok:new Set(),miss:0,start:Date.now(),ng:null};go('match')}
VIEWS.match=function(){if(!mt){go('games');return}const done=mt.ok.size===mt.ps.length;
  if(done&&!mt.end){mt.end=Date.now();mt.sec=Math.round((mt.end-mt.start)/1000);if(!P.matchBest||mt.sec<P.matchBest){P.matchBest=mt.sec;saveP('matchBest');mt.best=true}P.xp+=Math.max(10,60-mt.miss*5);saveP('xp');logDay('match')}
  const Lb=i=>`<button class="mt${isLatin(mt.ps[i][0])?' en':''}${mt.ok.has(i)?' ok':''}${mt.sel===i?' sel':''}" data-ml="${i}"${mt.ok.has(i)?' disabled':''}>${esc(mt.ps[i][0])}</button>`;
  const Rb=i=>`<button class="mt${mt.ok.has(i)?' ok':''}${mt.ng===i?' ng':''}" data-mr="${i}"${mt.ok.has(i)?' disabled':''} style="font-weight:500">${esc(mt.ps[i][1])}</button>`;
  app.innerHTML=`<div class="view">
   <div class="readbar"><button class="iconbtn" data-tab-go="games" aria-label="離開">${ICON.back}</button><span class="t">配對連連看</span><span class="muted" style="font-size:13px">配對 ${mt.ok.size}/${mt.ps.length}・失誤 ${mt.miss}</span></div>
   ${done?`<div class="endcard">${avHTML(PS,'lg')}<h3 class="gt">${mt.best?'新紀錄！':'完成！'}</h3><div class="qscore"><b>${mt.sec}</b><span> 秒</span></div><p>「${esc(pickLine(mt.miss?'ng':'ok'))}」失誤 ${mt.miss} 次・最快 ${P.matchBest} 秒</p><div class="acts"><button class="btn" data-match>再玩一次</button><button class="linkbtn" data-tab-go="games" style="align-self:center">回遊戲間</button></div></div>`
   :`<p class="note">先點左邊的詞，再點右邊對應的意思。</p><div class="match"><div class="col">${mt.left.map(Lb).join('')}</div><div class="col">${mt.right.map(Rb).join('')}</div></div>`}
  </div>`};

  for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
const FW=s=>s.replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
function splitInline(q){const re=/[(（]\s*([1-6１-６])\s*[)）]|([①②③④⑤⑥])/g;const ms=[...q.matchAll(re)];if(ms.length<2)return null;
  const nums=ms.map(m=>m[1]?+FW(m[1]):'①②③④⑤⑥'.indexOf(m[2])+1);for(let i=0;i<nums.length;i++)if(nums[i]!==i+1)return null;
  return {stem:q.slice(0,ms[0].index).trim(),o:ms.map((m,i)=>q.slice(m.index+m[0].length,i+1<ms.length?ms[i+1].index:q.length).trim().replace(/[。，、]$/,''))}}
function parseAns(ans,t,o){const s=FW(String(ans||'').trim()).toUpperCase().replace(/[()（）\s]/g,'');
  if(t==='tf'){if(/^(是|O|○|◯|T|TRUE|Y|YES|對|正確|V|✓)$/.test(s))return 0;if(/^(非|否|X|✕|×|F|FALSE|N|NO|錯|錯誤)$/.test(s))return 1;return -1}
  if(/^[A-F]$/.test(s))return s.charCodeAt(0)-65;if(/^[1-6]$/.test(s))return +s-1;return o.findIndex(x=>x.trim().toUpperCase()===s)}
function parseImport(text,fmt){const units=[],qs=[],skip=[];const uidOf=title=>{title=(title||'').trim()||'未分類';let u=units.find(x=>x.title===title);if(!u){u={id:'u'+units.length,title,desc:''};units.push(u)}return u.id};
  if(fmt==='json'){let j;try{j=JSON.parse(text)}catch(e){return {err:'JSON 格式錯誤：'+e.message,qs:[],units:[]}}
    if(Array.isArray(j))j=j[0]||{};if(!j||(!Array.isArray(j.qs)&&!Array.isArray(j.stories)))return {err:'找不到 qs 題目或 stories 故事',qs:[],units:[]};
    const umap={};(j.units||[]).forEach(u=>{umap[u.id]=uidOf(u.title)});
    (j.qs||[]).forEach((x,i)=>{const t=x.t==='tf'||!x.o||!x.o.length?'tf':'mc';const o=t==='mc'?x.o.map(String):[];const a=typeof x.a==='number'?x.a:parseAns(x.a,t,o);
      if(!x.q||a<0||(t==='mc'&&(o.length<2||a>=o.length))){skip.push('第 '+(i+1)+' 題資料不完整');return}qs.push({u:umap[x.u]||uidOf(x.u),t,q:String(x.q),o,a,e:String(x.e||'')})});
    const st=(j.stories||[]).filter(s=>s&&s.title&&s.text).map(s=>({title:String(s.title),p:String(s.p||PS.id),text:String(s.text)}));
    return {qs,units,skip,stories:st,meta:j}}
  const rows=parseCSV(text.replace(/^﻿/,''));if(!rows.length)return {err:'沒有內容',qs:[],units:[]};
  rows.forEach((r,i)=>{if(i===0&&/單元|unit|題目/i.test(r.join('')))return;const [u,ty,q0,ans,e,...os]=r.map(x=>(x||'').trim());
    if(!q0){skip.push('第 '+(i+1)+' 列沒有題目');return}let q=q0,o=os.filter(Boolean);if(!o.length){const sp=splitInline(q);if(sp){q=sp.stem;o=sp.o}}
    const t=/是非|tf|true|判斷/i.test(ty)?'tf':/選擇|mc|choice|單選/i.test(ty)?'mc':(o.length?'mc':'tf');if(t==='mc'&&o.length<2){skip.push('第 '+(i+1)+' 列選項不足');return}
    const a=parseAns(ans,t,o);if(a<0||(t==='mc'&&a>=o.length)){skip.push('第 '+(i+1)+' 列答案「'+ans+'」無法辨識');return}
    qs.push({u:uidOf(u),t,q,o:t==='mc'?o:[],a,e:e||''})});
  return {qs,units,skip}}

  if(ds.unwrong){delete P.wrong[ds.unwrong];saveP('wrong');closeSheet();toast('已移出錯題本');render();return}
  if(ds.font){fontSize=Math.min(26,Math.max(14,fontSize+(+ds.font)*2));rawStore.set('font',fontSize);document.documentElement.style.setProperty('--read-size',fontSize+'px');return}
  // 作答
  if(ds.opt!==undefined&&sess&&!sess.done){const it=cur();if(it.graded)return;it.pick=it.ord[+ds.opt];
    if(sess.instant){grade(it);if(sess.kind==='sprint'){render();toast(it.right?'✓':'✕ '+optText(it.q,it.q.a),800);setTimeout(()=>{if(sess&&!sess.done&&state.view==='run'){if(sess.i>=sess.items.length-1){finish();return}sess.i++;render()}},it.right?350:900);return}}

  if(ds.submit!==undefined){const un=sess.items.filter(x=>x.pick==null).length;if(un&&!state.confirmSubmit){state.confirmSubmit=1;toast('還有 '+un+' 題沒作答，再按一次交卷',2200);return}finish();return}
  if(ds.quit!==undefined){if(sess&&!sess.done&&sess.items.some(x=>x.pick!=null)){state.confirmQuit=1;render();window.scrollTo(0,document.body.scrollHeight)}else{stopTimer();go(sess?sess.from:'list')}return}
  if(ds.quityes!==undefined){stopTimer();const f=sess.from;sess=null;go(f||'list');return}
  if(ds.quitno!==undefined){state.confirmQuit=0;render();return}
  if(ds.again!==undefined){const s=sess;state.from=s.from;({scene:()=>startChapter(s.chapter),unit:()=>startUnit(s.unit,s.mode),story:()=>startStoryQuiz(s.sid),daily:startDaily,exam:startExam,sprint:startSprint,words:()=>startReview('words'),fav:()=>startReview('fav')}[s.kind]||(()=>startReview('wrong')))();return}
  if(ds.review!==undefined){startReview(ds.review||'wrong');return}
  if(ds.daily!==undefined){startDaily();return}
  if(ds.exam!==undefined&&gameLocked('exam')){openPaywall('game');return}
  if(ds.exam!==undefined){startExam();return}
  if(ds.sprint!==undefined&&gameLocked('sprint')){openPaywall('game');return}
  if(ds.sprint!==undefined){startSprint();return}
  if(ds.match!==undefined&&gameLocked('match')){openPaywall('game');return}
  if(ds.match!==undefined){startMatch();return}
  if(ds.ml!==undefined){const i=+ds.ml;if(mt.ok.has(i))return;mt.sel=i;mt.ng=null;render();return}
  if(ds.mr!==undefined){const i=+ds.mr;if(mt.sel==null){toast('先點左邊的詞');return}if(i===mt.sel){mt.ok.add(i);mt.sel=null;mt.ng=null}else{mt.miss++;mt.ng=i}render();return}
  // 來電
  if(ds.call!==undefined&&gameLocked('call')){openPaywall('game');return}
  if(ds.call!==undefined){startCall();return}
  if(ds.drive!==undefined&&gameLocked('drive')){openPaywall('game');return}
  if(ds.drive!==undefined){startDrive();return}
  if(ds.dopt!==undefined&&drive&&!drive.done){const it=drive.items[drive.i];if(it.graded)return;it.pick=it.ord[+ds.dopt];it.graded=true;it.right=it.pick===it.q.a;record(it.q,it.right);if(it.right)drive.score++;
    drive.log.push({who:'me',t:optText(it.q,it.pick)});drive.log.push({who:'him',t:'「'+pickLine(it.right?'ok':'ng')+'」'+(it.right?'':'\n正確做法：'+optText(it.q,it.q.a))});
    drive.i++;if(drive.i<drive.items.length){const q=drive.items[drive.i].q;drive.log.push({who:'him',t:fill(pick(DRIVE_ASK))+'\n'+q.q,media:qMedia(q)})}
    else{drive.done=true;drive.log.push({who:'him',t:'「'+endLine(drive.score*20)+'」'});P.xp+=drive.score*5+5;saveP('xp');logDay('drive')}
    render();return}
  if(ds.cdecline!==undefined){toast(`${PS.name}：${L('decline')}`,2800);call=null;go('games');return}
  if(ds.caccept!==undefined){call.stage='talk';call.log.push({who:'him',t:L('call')});const q=call.items[0].q;call.log.push({who:'him',q:1,t:'第 1 題：'+callQText(q),media:qMedia(q)});render();return}
  if(ds.copt!==undefined&&call&&call.stage==='talk'){const it=call.items[call.i];if(it.graded)return;it.pick=it.ord[+ds.copt];it.graded=true;it.right=it.pick===it.q.a;record(it.q,it.right);if(it.right)call.score++;
    call.log.push({who:'me',t:optText(it.q,it.pick)});call.log.push({who:'him',t:'「'+pickLine(it.right?'ok':'ng')+'」'+(it.right?'':'\n正解是：'+optText(it.q,it.q.a))});
    call.i++;if(call.i<call.items.length)call.log.push({who:'him',q:1,t:`第 ${call.i+1} 題：`+callQText(call.items[call.i].q),media:qMedia(call.items[call.i].q)});
    else{call.stage='done';call.log.push({who:'him',t:'「'+endLine(Math.round(call.score/3*100))+'」'});P.xp+=call.score*5+5;saveP('xp');logDay('call')}
    render();return}
  if(ds.chang!==undefined){if(call&&call.stage!=='done')toast(`${PS.name}：${L('decline')}`,2600);call=null;go('games');return}
  // 課表 / 生字本
  if(ds.askreset!==undefined){state.confirmReset=1;render();return}
  if(ds.cancelreset!==undefined){state.confirmReset=0;render();return}
  if(ds.resetplan!==undefined){P.read={};P.done={};P.best={};P.plan={start:dkey(),assign:{}};saveP('read','done','best','plan');state.confirmReset=0;toast('課表已重新開始');render();return}
  if(ds.calnav){calOff=Math.min(0,calOff+(+ds.calnav));render();return}
  if(ds.btab){state.tab=ds.btab;state.confirmClr=0;render();return}
  if(ds.clr!==undefined){state.confirmClr=1;render();return}
  if(ds.clrno!==undefined){state.confirmClr=0;render();return}
  if(ds.clryes){const k={words:'words',wrong:'wrong',fav:'fav'}[ds.clryes];P[k]={};saveP(k);state.confirmClr=0;toast('已清空');render();return}
  // 自訂
  if(ds.route){rawStore.set('route',ds.route);namesChanged();toast(isBL()?'已切換到 BL 線':'已切換到言情線');render();return}
  if(ds.theme){rawStore.set('theme',ds.theme);applyMode();if(!modal.hidden)openPicker();else render();return}
  if(ds.rnd){if(ds.rnd==='me')setMeName(rndName(youW()==='妳'?FEM:MASC));else setPersonaName(ds.rnd,rndName(MALE));if(!modal.hidden)openPicker();else render();toast('🎲 換好名字了');return}
  if(ds.rndall!==undefined){randomizeAll();render();toast('🎲 全部換上新名字');return}
  if(ds.editbank){closeSheet(true);go('bankedit',{id:ds.editbank,sub:'stories'});return}
  if(ds.use){loadBank(ds.use);loadProgress();toast('已切換到「'+B.short+'」');render();return}
  if(ds.sub){state.sub=ds.sub;state.confirmDel=0;render();return}
  if(ds.color){editBank().color=ds.color;document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.color===ds.color));const ci=$('input[type=color][data-bf=color]');if(ci)ci.value=ds.color;return}
  if(ds.savebank!==undefined){commitBank();return}
  if(ds.uadd!==undefined){const d=editBank();d.units.push({id:uid('u'),title:'新單元 '+(d.units.length+1),desc:''});render();return}
  if(ds.umove){const [i,dir]=ds.umove.split('.').map(Number);const d=editBank();const j=i+dir;[d.units[i],d.units[j]]=[d.units[j],d.units[i]];render();return}
  if(ds.udel!==undefined){const d=editBank();const u=d.units[+ds.udel];const n=getBank(state.id).qs.filter(q=>q.u===u.id).length;if(n&&!t.dataset.armed){t.dataset.armed=1;t.textContent='確定刪除（含 '+n+' 題）';return}d.units.splice(+ds.udel,1);render();return}
  if(ds.qnew!==undefined){go('qedit',{id:state.id,qid:null,uf:state.uf});return}
  if(ds.qedit){closeSheet(true);go('qedit',{id:ds.bank||state.id,qid:ds.qedit,uf:state.uf});return}
  if(ds.backbank!==undefined){go('bankedit',{id:state.id,sub:ds.backbank||'qs',uf:state.uf});return}
  if(ds.qt){const d=state.qd;if(d.t===ds.qt)return;d.t=ds.qt;d.a=0;if(d.t==='mc'&&d.o.length<2)d.o=['','','',''];render();return}
  if(ds.qtf!==undefined){state.qd.a=+ds.qtf;render();return}
  if(ds.qoadd!==undefined){state.qd.o.push('');render();return}
  if(ds.qodel!==undefined){const d=state.qd,i=+ds.qodel;d.o.splice(i,1);if(d.a===i)d.a=0;else if(d.a>i)d.a--;render();return}
  if(ds.qsave!==undefined){saveQ(ds.qsave==='next');return}
  if(ds.qdel!==undefined){state.confirmQDel=1;render();return}
  if(ds.qdelno!==undefined){state.confirmQDel=0;render();return}
  if(ds.qdelyes!==undefined){const b=JSON.parse(JSON.stringify(getBank(state.id)));b.qs=b.qs.filter(q=>q.id!==state.qd.id);saveBank(b);toast('已刪除');go('bankedit',{id:state.id,sub:'qs',uf:state.uf});return}
  if(ds.snew!==undefined){go('sedit',{id:state.id,sid:null});return}
  if(ds.sedit){const bb=getBank(state.id);const ss=bb&&bb.stories.find(x=>x.id===ds.sedit);if(storyLocked(ss)){openPaywall('story');return}}
  if(ds.sedit){go('sedit',{id:state.id,sid:ds.sedit});return}
  if(ds.ssave!==undefined){saveStory();return}
  if(ds.sdel!==undefined){state.confirmSDel=1;render();return}
  if(ds.sdelno!==undefined){state.confirmSDel=0;render();return}
  if(ds.sdelyes!==undefined){const b=JSON.parse(JSON.stringify(getBank(state.id)));b.stories=b.stories.filter(s=>s.id!==state.sd.id);saveBank(b);toast('已刪除');go('bankedit',{id:state.id,sub:'stories'});return}
  if(ds.pedit){go('pedit',{pid:ds.pedit});return}
  if(ds.usepersona){setPersona(ds.usepersona);toast(`${PS.name}：${L('hi')}`,2600);render();return}
  if(ds.photodel){delete photos[ds.photodel];rawStore.set('photos',photos);toast('已移除頭像');render();return}
  if(ds.duppersona!==undefined){const d=JSON.parse(JSON.stringify(state.pd));d.id=uid('p');delete d.builtin;d.type=d.type+'（自訂）';go('pedit',{pid:d.id,pd:d});return}
  if(ds.psave!==undefined){savePersona();return}
  if(ds.pdel!==undefined){state.confirmPDel=1;render();return}
  if(ds.pdelno!==undefined){state.confirmPDel=0;render();return}
  if(ds.pdelyes!==undefined){delete customPersonas[state.pd.id];rawStore.set('personas',customPersonas);if(PS.id===state.pd.id)setPersona('boss');toast('已刪除');go('custom');return}
  if(ds.delbank!==undefined){state.confirmDel=1;render();return}
  if(ds.delno!==undefined){state.confirmDel=0;render();return}
  if(ds.delyes!==undefined){const id=state.id,b=getBank(id);delete customBanks[id];rawStore.set('banks',customBanks);
    if(!b.builtin)rawStore.keys().filter(k=>k.startsWith(id+'.')).forEach(k=>rawStore.del(k));
    if(B.id===id){loadBank(b.builtin?id:allBanks()[0].id);loadProgress()}toast(b.builtin?'已還原為內建預設':'已刪除');go(b.builtin?'bankedit':'custom',{id,sub:'stories'});return}
  if(ds.dupbank){const src=getBank(ds.dupbank);const b=JSON.parse(JSON.stringify(src));b.id=uid('c');b.builtin=false;b.name=src.name+'（副本）';b.short=(src.short+'副本').slice(0,6);b.qs.forEach(q=>q.id=uid('q'));b.stories.forEach(s=>s.id=uid('s'));saveBank(b);toast('已另存為新類型');go('bankedit',{id:b.id,sub:'set'});return}
  if(ds.export){exportBank(ds.export);return}
  if(ds.copyexp){copyText(window._exp[ds.copyexp],'已複製 '+ds.copyexp.toUpperCase());return}
  if(ds.dlexp){const x=window._exp;download(x.name+(ds.dlexp==='json'?'.json':'.csv'),x[ds.dlexp],ds.dlexp==='json'?'application/json':'text/csv');return}
  if(ds.importto){go('import',{target:ds.importto,fmt:'csv'});return}
  if(ds.fmt){state.fmt=ds.fmt;state.preview=null;render();return}
  if(ds.tpl!==undefined){state.showTpl=!state.showTpl;render();return}
  if(ds.copytpl!==undefined){copyText(CSV_TEMPLATE,'已複製範本，可貼到 Excel 或文字檔');return}
  if(ds.preview!==undefined){const txt=($('#imtext')||{}).value||'';state.imtext=txt;if(!txt.trim()){toast('請選擇檔案或貼上內容');return}state.preview=parseImport(txt,state.fmt||'csv');render();return}
  if(ds.doimport!==undefined){doImport();return}
  if(ds.backup!==undefined){copyText(backupText(),'已複製備份，請貼到記事本保存');return}
  if(ds.restore!==undefined){openModal(`<span class="kicker">還原備份</span><h2 class="gt">貼上備份文字</h2><p class="note">會覆蓋這台裝置上相同的題庫、故事與進度。</p><textarea id="rstext" class="inp" style="min-height:160px;font-size:12px;font-family:ui-monospace,monospace"></textarea><button class="btn" data-dorestore>還原</button><button class="linkbtn" data-close style="align-self:center">取消</button>`);return}
  if(ds.dorestore!==undefined){restoreFrom($('#rstext').value);return}
});
document.addEventListener('input',e=>{const t=e.target;
  const keepFocus=(id,key)=>{state[key]=t.value;const pos=t.selectionStart;render();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}};
  if(t.id==='qsearch'){keepFocus('qsearch','q');return}
  if(t.id==='bqsearch'){keepFocus('bqsearch','qq');return}
  if(t.dataset.bf){const d=editBank();setPath(d,t.dataset.bf,t.type==='checkbox'?t.checked:t.value);if(t.dataset.bf==='color')document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.color.toLowerCase()===t.value.toLowerCase()));return}
  if(t.dataset.uf){const [i,k]=t.dataset.uf.split('.');editBank().units[+i][k]=t.value;return}
  if(t.dataset.qf){state.qd[t.dataset.qf]=t.value;return}
  if(t.dataset.qo!==undefined){state.qd.o[+t.dataset.qo]=t.value;return}
  if(t.dataset.sf){state.sd[t.dataset.sf]=t.value;if(t.dataset.sf==='text')refreshStoryPreview();return}
  if(t.dataset.pf){state.pd[t.dataset.pf]=['ok','ng','end'].includes(t.dataset.pf)?t.value.split('\n'):t.value;return}
  if(t.id==='imtext'){state.imtext=t.value;state.preview=null;return}
  if(t.id==='imname'){state.imname=t.value;return}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.photo){setPhoto(t.dataset.photo,t.files[0]);return}
  if(t.dataset.name){const v=t.value.trim();if(!v){toast('名字不能空白');return}if(t.dataset.name==='me')setMeName(v);else setPersonaName(t.dataset.name,v);toast('名字已更新');if(!modal.hidden)openPicker();else render();return}
  if(t.id==='bqunit'){state.uf=t.value;render();return}
  if(t.dataset.qa!==undefined&&t.type==='radio'){state.qd.a=+t.dataset.qa;return}
  if(t.id==='imtarget'){state.target=t.value;state.preview=null;render();return}
  if(t.id==='imfile'&&t.files[0]){const f=t.files[0];if(/\.json$/i.test(f.name))state.fmt='json';else if(/\.(csv|txt|tsv)$/i.test(f.name))state.fmt='csv';
    const r=new FileReader();r.onload=()=>{const txt=String(r.result);if(txt.includes('\uFFFD')&&state.fmt==='csv'){const r2=new FileReader();r2.onload=()=>{state.imtext=String(r2.result);state.preview=parseImport(state.imtext,'csv');render()};r2.readAsText(f,'big5');return}
      state.imtext=txt;state.preview=parseImport(txt,state.fmt||'csv');render()};r.readAsText(f,'utf-8')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.name){e.target.blur();return}
  if(e.key==='Enter'&&e.target.id==='ucode'){tryUnlock();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.w,[data-reveal]')){e.preventDefault();e.target.click();return}
  if(e.key==='Escape'){if(!modal.hidden&&!modal.dataset.lock)closeModal();else if(!sheet.hidden)closeSheet()}
  if(state.view==='run'&&sess&&!sess.done&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){const k=e.key.toUpperCase();const idx=KEYS.indexOf(k)>=0?KEYS.indexOf(k):/^[1-6]$/.test(k)?+k-1:-1;
    if(idx>=0&&idx<cur().ord.length){const b=document.querySelector(`[data-opt="${idx}"]`);if(b&&!b.disabled)b.click()}
    else if(e.key==='Enter'||e.key==='ArrowRight'){const b=document.querySelector('[data-next],[data-finish]');if(b)b.click()}
    else if(e.key==='ArrowLeft'){const b=document.querySelector('[data-prev]');if(b)b.click()}}});
document.addEventListener('click',e=>{if(!e.target.closest('[data-submit]'))state.confirmSubmit=0},true);

/* ---------- boot ---------- */
applyMode();
loadBank(rawStore.get('track','toeic'));
loadProgress();
render();
if(!rawStore.get('welcomed',0))setTimeout(()=>openPicker(true),300);
syncLicense();
