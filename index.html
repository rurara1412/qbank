<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="看男主角的短篇小說，不知不覺記住重點：多益、日檢、機車筆試，並可自訂題庫、故事與男主角。">
<meta name="theme-color" content="#0A0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="男主刷題">
<title>男主教你刷題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
/* Layout: 單欄手機 App — 小說閱讀面、底部分頁列、上滑解析面板。
   所有顏色都來自主題變數，切換 data-theme 即可換整套風格。 */
:root,[data-theme="noir"]{
  /* 午夜鎏金：霧面黑、古銅金、象牙白字，低調不反光 */
  --bg:#0F0E0C; --bg-grad:#0F0E0C; --card:#171512; --card2:#1E1B17; --ink:#EDE6D6; --story:#E3DACA; --muted:#8E8574; --line:#29251F; --line2:#4A3F2C;
  --acc:#C3A267; --acc-hi:#E2CB98; --on-acc:#14110C; --btn:#C3A267; --btn-ink:#14110C;
  --head:#F2EBDC; --head-bg:linear-gradient(#F2EBDC,#F2EBDC);
  --hero:#1B1813; --hero-ink:#F2EBDC; --hero-muted:#9C927E; --hero-line:#3B3326;
  --mark:rgba(195,162,103,.14); --mark-ink:#E2CB98; --term-line:rgba(195,162,103,.45);
  --tab-bg:rgba(15,14,12,.96); --tabs-ink:#6F685B; --overlay:rgba(0,0,0,.66); --ok:#86C5A0; --ng:#E48A79;
  --shadow:0 14px 34px rgba(0,0,0,.5); --r:12px; --r-lg:16px; --pill:999px;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-en:"Newsreader",Georgia,"Noto Serif JP",serif;
  color-scheme:dark;
}
[data-theme="ivory"]{
  /* 香檳象牙：米白紙張、香檳金、墨色字 */
  --bg:#F6F1E7; --bg-grad:#F6F1E7; --card:#FFFDF8; --card2:#F1EADC; --ink:#2B261D; --story:#2F2920; --muted:#8B806B; --line:#E5DCCB; --line2:#CDB88E;
  --acc:#9C7A35; --acc-hi:#7E6020; --on-acc:#FFFDF8; --btn:#2B261D; --btn-ink:#F6F1E7;
  --head:#2B261D; --head-bg:linear-gradient(#2B261D,#2B261D);
  --hero:#2B261D; --hero-ink:#F6F1E7; --hero-btn:#E9DFC8; --hero-btn-ink:#2B261D; --hero-muted:#B9AE98; --hero-line:#4A4233;
  --mark:rgba(156,122,53,.12); --mark-ink:#7E6020; --term-line:rgba(156,122,53,.38);
  --tab-bg:rgba(246,241,231,.96); --tabs-ink:#A39780; --overlay:rgba(40,32,20,.45); --ok:#2F7A5B; --ng:#B4473A;
  --shadow:0 12px 30px rgba(60,45,20,.12); color-scheme:light;
}
[data-theme="velvet"]{
  /* 酒紅絲絨：深酒紅、玫瑰金 */
  --bg:#190A0F; --bg-grad:radial-gradient(120% 70% at 50% -10%,#3A1420 0%,#190A0F 60%); --card:#22101A; --card2:#2C1520; --ink:#F4E4E7; --story:#EBD7DB; --muted:#B08F97; --line:#3A1C27; --line2:#6A3A45;
  --acc:#E0AE7E; --acc-hi:#F2CDA6; --on-acc:#2A0E17; --btn:#E0AE7E; --btn-ink:#2A0E17;
  --head:#F8E9EC; --head-bg:linear-gradient(180deg,#FBEDEF,#F2CDA6);
  --hero:#2E121D; --hero-ink:#F8E9EC; --hero-muted:#C29EA6; --hero-line:#5A2C38;
  --mark:rgba(224,174,126,.14); --mark-ink:#F2CDA6; --term-line:rgba(224,174,126,.45);
  --tab-bg:rgba(25,10,15,.96); --tabs-ink:#8A6A72; --overlay:rgba(10,2,5,.7); --ok:#8FD0A9; --ng:#FF9B8F; color-scheme:dark;
}
[data-theme="jade"]{
  /* 翡翠夜宴：墨綠、淡金 */
  --bg:#09130F; --bg-grad:radial-gradient(120% 70% at 50% -10%,#163126 0%,#09130F 60%); --card:#0F1D18; --card2:#14261F; --ink:#E5EEE8; --story:#D9E5DD; --muted:#88A196; --line:#1D3229; --line2:#3E5C4C;
  --acc:#D1B77E; --acc-hi:#E9D7A8; --on-acc:#0B1611; --btn:#D1B77E; --btn-ink:#0B1611;
  --head:#EEF5F0; --head-bg:linear-gradient(#EEF5F0,#EEF5F0);
  --hero:#12251D; --hero-ink:#EEF5F0; --hero-muted:#93AC9F; --hero-line:#2B4A3C;
  --mark:rgba(209,183,126,.13); --mark-ink:#E9D7A8; --term-line:rgba(209,183,126,.42);
  --tab-bg:rgba(9,19,15,.96); --tabs-ink:#5F7A6D; --overlay:rgba(0,6,3,.7); --ok:#8FD6AE; --ng:#F09A86; color-scheme:dark;
}
[data-theme="rose"]{
  /* 霧粉玫瑰：柔粉、灰玫瑰、圓潤 */
  --bg:#FBF3F2; --bg-grad:#FBF3F2; --card:#FFFFFF; --card2:#F7E8E8; --ink:#3B2B30; --story:#3B2B30; --muted:#9C858B; --line:#F0DEDE; --line2:#E2B9C2;
  --acc:#B2657A; --acc-hi:#954A5F; --on-acc:#FFFFFF; --btn:#B2657A; --btn-ink:#FFFFFF;
  --head:#3B2B30; --head-bg:linear-gradient(#3B2B30,#3B2B30);
  --hero:#FFFFFF; --hero-ink:#3B2B30; --hero-muted:#9C858B; --hero-line:#F0DEDE;
  --mark:#F8DDE4; --mark-ink:#954A5F; --term-line:#F2C4D0;
  --tab-bg:rgba(251,243,242,.96); --tabs-ink:#B49FA4; --overlay:rgba(60,30,40,.4); --ok:#2F8A62; --ng:#C4475B;
  --shadow:0 12px 30px rgba(150,80,100,.12); --r:16px; --r-lg:22px; color-scheme:light;
}
[data-theme="classic"]{
  /* 經典霸總：紙白、酒紅（參考原版） */
  --bg:#FBF8F7; --bg-grad:#FBF8F7; --card:#FFFFFF; --card2:#F4ECEE; --ink:#2B2030; --story:#2B2030; --muted:#76697B; --line:#ECE3E5; --line2:#D9B9C3;
  --acc:#9A2B4A; --acc-hi:#7E1F3B; --on-acc:#FFFFFF; --btn:#9A2B4A; --btn-ink:#FFFFFF;
  --head:#2B2030; --head-bg:linear-gradient(#2B2030,#2B2030);
  --hero:#2B2030; --hero-ink:#FBF8F7; --hero-btn:#FBF8F7; --hero-btn-ink:#2B2030; --hero-muted:#BFB3C2; --hero-line:#45384A;
  --mark:#F7DCE3; --mark-ink:#7E1F3B; --term-line:#F7DCE3;
  --tab-bg:rgba(251,248,247,.97); --tabs-ink:#9A8E9D; --overlay:rgba(20,8,14,.42); --ok:#2F7A5B; --ng:#C8364B;
  --shadow:0 10px 30px rgba(60,20,40,.12); --r:14px; --r-lg:20px; color-scheme:light;
}
[data-theme="moon"]{
  /* 月光霧藍：深夜藍、銀灰霧光（BL 線推薦） */
  --bg:#0C1220; --bg-grad:radial-gradient(120% 70% at 50% -10%,#1C2A47 0%,#0C1220 60%); --card:#131B2E; --card2:#18223A; --ink:#E6ECF7; --story:#D9E1F0; --muted:#8A97B3; --line:#222D46; --line2:#3E4E73;
  --acc:#9DB4D8; --acc-hi:#C9D8F0; --on-acc:#0C1220; --btn:#9DB4D8; --btn-ink:#0C1220;
  --head:#EEF2FA; --head-bg:linear-gradient(180deg,#F3F6FC,#B9CAE6);
  --hero:#16213A; --hero-ink:#EEF2FA; --hero-muted:#98A6C2; --hero-line:#2C3A5C;
  --mark:rgba(157,180,216,.15); --mark-ink:#C9D8F0; --term-line:rgba(157,180,216,.45);
  --tab-bg:rgba(12,18,32,.96); --tabs-ink:#5F6C89; --overlay:rgba(2,5,12,.7); --ok:#8FD0B0; --ng:#F2949A; color-scheme:dark;
}
:root{--read-size:18px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg-grad) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent;transition:background-color .2s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:22px;padding-top:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35;font-weight:700;color:var(--head)}
.gt{background:var(--head-bg);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--acc);font-weight:500}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.rule{height:1px;background:var(--line);border:0;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:var(--pill);background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:15.5px;letter-spacing:.06em}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--acc-hi);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{min-height:38px;padding:0 16px;font-size:14px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--ng);box-shadow:inset 0 0 0 1px var(--ng)}
.icon{width:20px;height:20px;flex:none}
.linkbtn{color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;align-self:flex-start;min-height:36px}
.acts{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* brand + persona */
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink);min-width:0}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:900;flex:none;color:#fff}
.typebtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 14px;border-radius:var(--pill);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;color:var(--muted);flex:none;min-height:36px;max-width:62%}
.typebtn b{color:var(--acc-hi);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typebtn .icon{width:15px;height:15px;color:var(--acc)}
.av{--s:48px;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;padding:1.5px;background:var(--acc)}
.av i{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--card2);font-style:normal;font-family:var(--f-display);font-weight:900;font-size:calc(var(--s)*.42);color:var(--acc-hi)}
.av.lg{--s:72px}.av.xl{--s:108px}.av.sm{--s:34px}

/* Home */
.hero{padding-top:10px;display:flex;flex-direction:column;gap:14px}
.who{display:flex;align-items:center;gap:12px}
.who b{display:block;font-family:var(--f-display);font-size:16.5px;color:inherit}
.who small{display:block;font-size:12.5px;color:var(--muted)}
.hero h1{font-size:clamp(25px,7.2vw,38px);font-weight:900;line-height:1.42}
.hero .line2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(16px,4.6vw,20px);color:var(--acc-hi);line-height:1.55}
.hero p{margin:0;font-size:15px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-en);font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-en);font-weight:600;font-size:17px;color:var(--acc-hi);box-shadow:inset 0 0 0 1px var(--line2)}
.steps h3{font-size:16px}
.steps p{margin:2px 0 0;color:var(--muted);font-size:14px}
.continue{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;text-align:left;width:100%}
.continue .no{font-family:var(--f-en);font-size:28px;font-weight:600;color:var(--acc);min-width:46px}
.continue div{min-width:0}
.continue strong{display:block;font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px}
.lux{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--card);box-shadow:inset 0 0 0 1px var(--line2);text-align:left;width:100%;color:var(--ink)}
.lux b{display:block;color:var(--acc-hi);font-size:15px;font-family:var(--f-display)}
.lux small{display:block;font-size:12.5px;line-height:1.5;color:var(--muted)}
.lux .go{margin-left:auto;color:var(--acc);font-size:22px}
.foot{border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.foot p{margin:0}

/* Today / plan（深色卡片在亮色主題中也維持對比） */
.today{position:relative;border-radius:var(--r-lg);padding:22px 20px;background:var(--hero);color:var(--hero-ink);box-shadow:inset 0 0 0 1px var(--hero-line);display:flex;flex-direction:column;gap:10px;overflow:hidden;text-align:left;width:100%}
.today::before{content:"";position:absolute;left:20px;top:0;width:36px;height:2px;background:var(--acc)}
.today .day{font-family:var(--f-en);font-size:12px;letter-spacing:.22em;color:var(--acc)}
.today h2{font-size:23px;font-weight:900;position:relative;color:var(--hero-ink)}
.today p,.today .who small{margin:0;color:var(--hero-muted);font-size:14px;position:relative}
.today .btn{align-self:flex-start;position:relative;background:var(--hero-btn,var(--btn));color:var(--hero-btn-ink,var(--btn-ink))}
.today .done{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--acc)}
.today .big{position:absolute;right:-2px;top:-20px;font-family:var(--f-en);font-weight:600;font-size:120px;line-height:1;opacity:.1;pointer-events:none;color:var(--hero-ink)}
.today .who{position:relative}
.plan{display:flex;flex-direction:column}
.plan .prow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.plan .when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan .when b{display:block;color:var(--ink);font-size:15px}
.plan strong{display:block;font-family:var(--f-display);font-size:16px;min-width:0}
.plan small{color:var(--muted);font-size:12.5px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.section-h h3{font-size:17px}
.blk{display:flex;flex-direction:column;gap:10px}
.confirm{background:var(--card2);border:1px solid var(--line2);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.confirm .acts{flex-direction:row;flex-wrap:wrap}

/* List */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;min-height:46px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);outline:none;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:var(--pill);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none;font-weight:700}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row .no{font-family:var(--f-en);font-size:22px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.row.read .no{color:var(--acc)}
.row div{min-width:0}
.row strong{display:block;font-family:var(--f-display);font-weight:700;font-size:16.5px}
.row small{color:var(--muted);font-size:12.5px}
.badge{font-size:11.5px;padding:3px 9px;border-radius:var(--pill);background:var(--mark);color:var(--mark-ink);white-space:nowrap}
.badge.dim{background:var(--card2);color:var(--muted)}
.empty{padding:30px 6px;color:var(--muted);text-align:center}
.qrow{display:block;width:100%;text-align:left;padding:12px 2px;border-bottom:1px solid var(--line)}
.qrow .qt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;white-space:pre-line}
.qrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
.wbrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.wbrow button.main{text-align:left;min-width:0}
.wbrow .en{font-family:var(--f-en);font-size:19px;font-weight:600;color:var(--ink)}
.wbrow .zh{color:var(--muted);font-size:13.5px;margin-left:8px}
.wbrow .from{display:block;font-size:12px;color:var(--muted)}

/* Cover / intro */
.cover{position:relative;border-radius:var(--r-lg);padding:26px 22px 22px;background:var(--hero);color:var(--hero-ink);box-shadow:inset 0 0 0 1px var(--hero-line);overflow:hidden;display:flex;flex-direction:column;gap:12px}
.cover .big{position:absolute;right:-6px;bottom:-36px;font-family:var(--f-en);font-weight:600;font-size:150px;line-height:1;opacity:.1;color:var(--hero-ink)}
.cover h2{font-size:28px;font-weight:900;position:relative;color:var(--hero-ink)}
.cover p,.cover .who small{margin:0;color:var(--hero-muted);font-size:14.5px;position:relative}
.cover .eyebrow{position:relative}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;min-height:40px;align-self:flex-start}
.teaser{font-size:var(--read-size);line-height:2;padding-left:14px;border-left:2px solid var(--acc);margin:0;font-family:var(--f-display);color:var(--story)}
.wordchips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{font-family:var(--f-en);font-size:15.5px;padding:5px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.wchip small{font-family:var(--f-body);color:var(--muted);font-size:12px;margin-left:6px}
.seg{display:flex;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--pill);padding:3px}
.seg button{flex:1;padding:7px 12px;border-radius:var(--pill);font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.modehint{font-size:13px;color:var(--muted);margin:-8px 0 0}

/* Reader */
.readbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 0;margin-top:-18px;margin-bottom:-10px}
.readbar .t{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readbar .progress{position:absolute;left:0;right:0;bottom:0}
.readbar .seg button{padding:5px 10px;font-size:12.5px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--muted)}
.iconbtn:active{background:var(--card2)}
.iconbtn[aria-pressed="true"]{color:var(--acc)}
.progress{height:2px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.story{font-size:var(--read-size);line-height:2.1;display:flex;flex-direction:column;gap:1.15em;font-family:var(--f-display);font-weight:500;color:var(--story)}
.story p{margin:0}
article.story p:first-child::first-letter{font-size:2.3em;float:left;line-height:1;margin:.14em .14em 0 0;color:var(--acc)}
.w{display:inline;font-family:var(--f-en);font-size:1.04em;font-weight:600;color:var(--mark-ink);background:linear-gradient(transparent 66%,var(--term-line) 66%);padding:0 2px;margin:0 1px;border-radius:2px;cursor:pointer}
.w.cjk{font-family:var(--f-display)}
.w.saved{background:var(--mark)}
.g{color:var(--muted);font-size:.78em;margin-right:2px;font-family:var(--f-body);font-weight:400}
.g.hide{display:inline-block;min-width:3.2em;text-align:center;border-radius:6px;background:var(--card2);color:transparent;cursor:pointer;line-height:1.5;vertical-align:.08em;user-select:none}
.g.hide.show{color:var(--muted);background:transparent}
.endcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.endcard h3{font-size:19px}
.endcard p{margin:0;color:var(--muted);font-size:14px}
.endcard .acts{width:100%}
.fontctl{display:flex}

/* Question card */
.qcard{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 18px}
.qmeta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.qmeta .kind{padding:2px 9px;border-radius:var(--pill);background:var(--mark);color:var(--mark-ink);font-weight:700}
.qmeta .sp{flex:1}
.qtext{font-size:var(--read-size);line-height:1.85;font-weight:500;white-space:pre-line;word-break:break-word}
.qtext.en{font-family:var(--f-en);font-size:calc(var(--read-size) + 1px)}
.qtext.big{font-family:var(--f-display);font-size:clamp(26px,7.5vw,36px);font-weight:900;text-align:center;line-height:1.35;padding:6px 0}
.opts{display:grid;gap:8px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:16px;font-weight:500;text-align:left;color:var(--ink);line-height:1.5}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line2);font-family:var(--f-en);font-weight:600;font-size:14px;color:var(--acc)}
.opts.tf .opt{justify-content:center;font-size:20px;font-weight:700;padding:16px}
.opt.sel{box-shadow:inset 0 0 0 1.5px var(--acc);background:var(--mark)}
.opt.sel .k{background:var(--acc);color:var(--on-acc)}
.opt.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card));box-shadow:inset 0 0 0 1.5px var(--ok)}
.opt.ok .k{background:var(--ok);color:var(--card);box-shadow:none}
.opt.ng{background:color-mix(in srgb,var(--ng) 12%,var(--card));box-shadow:inset 0 0 0 1.5px var(--ng)}
.opt.ng .k{background:var(--ng);color:var(--card);box-shadow:none}
.exp{background:var(--card2);border-left:2px solid var(--acc);border-radius:4px var(--r) var(--r) 4px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.exp b{font-size:13px;letter-spacing:.06em;color:var(--acc)}
.exp.okb{border-color:var(--ok)}.exp.okb b{color:var(--ok)}.exp.ngb{border-color:var(--ng)}.exp.ngb b{color:var(--ng)}
.qnav{display:flex;gap:10px}
.qnav .btn{flex:1}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dots button{width:30px;height:30px;border-radius:9px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dots button.ans{background:var(--mark);color:var(--mark-ink)}
.dots button.okd{color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.dots button.ngd{color:var(--ng);box-shadow:inset 0 0 0 1px var(--ng)}
.dots button.cur{box-shadow:inset 0 0 0 2px var(--acc)}

/* Persona bubble */
.coach{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-lg);background:var(--hero);color:var(--hero-ink);box-shadow:inset 0 0 0 1px var(--hero-line)}
.coach p{margin:0;font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.5}
.coach small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--hero-muted);margin-top:3px}

/* Stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-en);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi b small{font-size:15px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi span{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:10px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:10px}
.barrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center}
.cal .d{aspect-ratio:1;border-radius:7px;background:var(--card);display:grid;place-items:center;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .d.on{background:var(--acc);color:var(--on-acc);font-weight:700}
.cal .d.now{box-shadow:inset 0 0 0 1.5px var(--acc)}
.cal .d.blank{background:transparent}
.cal .d.fut{opacity:.4}
.calhead{display:flex;align-items:center;gap:8px}.calhead b{font-size:15.5px}.calhead .muted{flex:1;font-size:13px}.calhead .iconbtn{font-size:22px;width:34px;height:34px}.calhead .iconbtn:disabled{opacity:.3}
.hist{display:flex;flex-direction:column}
.hist button{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.hist .no{font-family:var(--f-en);font-weight:600;color:var(--acc);font-size:18px}
.hist strong{font-family:var(--f-display);font-size:15px;font-weight:700;min-width:0}
.hist time{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ubar{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;font-size:13.5px}

/* Games */
.gm-rank{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:14px 16px;border-radius:var(--r-lg);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.gm-rank b{display:block;font-family:var(--f-en);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}.gm-rank b small{font-size:14px;color:var(--acc)}
.gm-rk{display:flex;flex-direction:column;align-items:flex-end}.gm-rk strong{font-family:var(--f-display);font-size:17px}
.gm-lv{font-family:var(--f-en);font-weight:600;color:var(--acc);font-size:15px}
.gm-list{display:grid;gap:10px}
.gm-g{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-lg);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);text-align:left;color:var(--ink);width:100%}
.gm-g:disabled{opacity:.45}
.gm-ic{width:52px;height:52px;border-radius:var(--r);display:grid;place-items:center;background:var(--card2);color:var(--acc-hi);font-family:var(--f-display);font-weight:900;font-size:20px}
.gm-tx b{display:block;font-family:var(--f-display);font-size:16.5px}.gm-tx small{display:block;color:var(--muted);font-size:13px;line-height:1.45}.gm-tx em{font-style:normal;font-size:12px;color:var(--acc);font-weight:700}
.gm-go{color:var(--acc);font-size:22px}
.qscore{text-align:center;font-family:var(--f-en)}.qscore b{font-size:76px;font-weight:600;color:var(--acc-hi)}.qscore span{font-size:24px;color:var(--muted)}
.pass{align-self:center;padding:4px 14px;border-radius:var(--pill);font-weight:700;font-size:14px}
.pass.y{color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}.pass.n{color:var(--ng);box-shadow:inset 0 0 0 1px var(--ng)}
.timer{font-family:var(--f-en);font-variant-numeric:tabular-nums;font-weight:600;color:var(--acc)}
.timer.low{color:var(--ng)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{min-height:54px;padding:8px 10px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:14.5px;color:var(--ink);line-height:1.35;word-break:break-word}
.mt.en{font-family:var(--f-en);font-size:17px}
.mt.sel{box-shadow:inset 0 0 0 1.5px var(--acc);background:var(--mark)}
.mt.ok{opacity:.3;box-shadow:inset 0 0 0 1px var(--ok)}
.mt.ng{animation:sh .35s;box-shadow:inset 0 0 0 1.5px var(--ng)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Phone call */
.phone{position:relative;border-radius:28px;padding:28px 20px 24px;background:var(--hero);color:var(--hero-ink);box-shadow:inset 0 0 0 1px var(--hero-line),var(--shadow);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;overflow:hidden}
.phone h2{font-size:24px;color:var(--hero-ink)}
.phone .ring{position:relative;display:grid;place-items:center;margin:6px 0}
.phone .ring::before,.phone .ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid var(--acc);animation:ripple 2s ease-out infinite}
.phone .ring::after{animation-delay:1s}
@keyframes ripple{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.phone .st{font-size:13px;color:var(--hero-muted);letter-spacing:.1em}
.phone .say{background:color-mix(in srgb,var(--hero-ink) 7%,transparent);border:1px solid var(--hero-line);border-radius:14px;padding:12px 14px;font-size:15px;max-width:30em;margin:0}
.callbtns{display:flex;gap:60px;margin-top:8px}
.callbtns button{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff}
.callbtns .no{background:#C2453A}.callbtns .yes{background:#2E9E5B}
.callbtns small{display:block;font-size:12px;color:var(--hero-muted);margin-top:6px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15.5px;line-height:1.6;white-space:pre-line}
.bub.him{align-self:flex-start;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-bottom-left-radius:6px}
.bub.him.q{color:var(--acc-hi);font-weight:700;box-shadow:inset 0 0 0 1px var(--line2)}
.bub.me{align-self:flex-end;background:var(--btn);color:var(--btn-ink);font-weight:700;border-bottom-right-radius:6px}
.callhead{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.callhead b{font-family:var(--f-display)}.callhead small{display:block;color:var(--ok);font-size:12px}
.callhead .sp{flex:1}
.hang{width:42px;height:42px;border-radius:50%;background:#C2453A;color:#fff;display:grid;place-items:center}

/* Custom */
.bankcard{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-lg);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);text-align:left;width:100%}
.bankcard.cur{box-shadow:inset 0 0 0 1.5px var(--acc)}
.bankcard .logo{width:46px;height:46px;border-radius:14px;font-size:19px}
.bankcard b{display:block;font-family:var(--f-display);font-size:16px}
.bankcard small{display:block;color:var(--muted);font-size:12.5px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12.5px;font-weight:700;color:var(--acc);letter-spacing:.06em}
.field small{color:var(--muted);font-size:12px}
.inp,.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;min-height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;font:inherit;font-size:15.5px}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);outline:none}
.field textarea{min-height:88px;resize:vertical;line-height:1.6}
.field textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:180px}
.field textarea.story-in{min-height:280px;font-size:15px;line-height:1.8}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.3)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.swatches input[type=color]{width:40px;height:36px;border:0;background:none;padding:0}
.optedit{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.optedit input[type=radio]{width:22px;height:22px;accent-color:var(--acc)}
.unitedit{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.tabsw{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.tabsw button{padding:10px 4px;border-radius:calc(var(--r) - 3px);font-weight:700;font-size:14px;color:var(--muted)}
.tabsw button.on{background:var(--ink);color:var(--bg)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;white-space:pre;overflow:auto;margin:0}
.pane{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
/* 名字設定 */
.namerow{display:grid;grid-template-columns:auto 1fr 44px;gap:10px;align-items:center}
.namerow .lab{font-size:13px;color:var(--muted);min-width:4.5em}
.namerow .lab b{display:block;color:var(--ink);font-size:13.5px}
.namerow .inp{min-height:42px;font-family:var(--f-display);font-size:16px;font-weight:700}
.dice{width:44px;height:42px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:20px;display:grid;place-items:center}
.dice:active{transform:rotate(25deg)}
/* 主題選擇 */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:var(--r-lg);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);text-align:left}
.theme.on{box-shadow:inset 0 0 0 2px var(--acc)}
.theme .pv{height:64px;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-display);font-weight:900;font-size:15px}
.theme .pv i{display:block;width:44%;height:8px;border-radius:999px}
.theme b{font-size:14px;font-family:var(--f-display)}
.theme small{font-size:12px;color:var(--muted);line-height:1.4}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding:8px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet .inner{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:4px auto 0}
.sheethead{display:flex;align-items:center;gap:8px}
.sheethead .sp{flex:1}
.hw h2{font-family:var(--f-en);font-weight:600;font-size:34px;line-height:1.15;word-break:break-word;color:var(--ink)}
.hw h2.cjk{font-family:var(--f-display)}
.zhmain{font-size:19px;font-weight:700;color:var(--acc-hi)}
.save{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center;flex:none;color:var(--muted)}
.save[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);box-shadow:none}
.speak{width:44px;height:44px;border-radius:50%;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;flex:none}
.lbl{font-size:11px;letter-spacing:.22em;color:var(--acc);font-weight:500}
.ctx{font-size:15px;line-height:1.9;font-family:var(--f-display);color:var(--story)}
.ctx .w{cursor:default}
.ctx .src{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-family:var(--f-body)}

/* Modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:var(--overlay)}
.modal .box{width:min(100%,470px);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);text-align:center}
.modal .box h2{font-size:21px}
.modal .box p{margin:0}
.modal .kicker{font-size:11px;letter-spacing:.24em;color:var(--acc);font-weight:700}
.pkstep{display:flex;flex-direction:column;gap:6px;text-align:left}
.pklabel{font-size:12.5px;font-weight:700;color:var(--acc);letter-spacing:.08em}
.pkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pkbtn{padding:10px 4px;border-radius:var(--r);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;font-weight:700;line-height:1.3;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:76px}
.pkbtn.on{box-shadow:inset 0 0 0 1.5px var(--acc);background:var(--mark)}
.pkbtn small{font-size:11px;font-weight:500;color:var(--muted)}
.pkbtn.add{border:1px dashed var(--line2);box-shadow:none;color:var(--muted)}
.pkcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px;border-radius:var(--r-lg);background:var(--card);box-shadow:inset 0 0 0 1px var(--acc)}
.pkcard small{color:var(--muted);font-size:12.5px}
.pkcard p{margin:0;font-size:13.5px}
.pkcard .btn{margin-top:4px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:var(--pill);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:12.5px;color:var(--ink)}
.tchip i{width:18px;height:18px;border-radius:50%}
.tchip.on{box-shadow:inset 0 0 0 1.5px var(--acc);font-weight:700}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--tab-bg);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr) 1.25fr}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tabs-ink);padding:6px 0;min-height:52px}
.tabs button[aria-current="page"]{color:var(--acc-hi);font-weight:700}
.tabs .cnt{font-variant-numeric:tabular-nums;color:var(--acc)}
.tabs .tab-gm{padding:4px 4px 6px}

.qimg{display:block;max-width:100%;max-height:340px;margin:2px auto;border-radius:10px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.bub .qimg{margin-top:8px;max-height:260px}
.vidlink{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:var(--pill);box-shadow:inset 0 0 0 1px var(--line2);color:var(--acc-hi);font-weight:700;font-size:14px;text-decoration:none;margin-top:6px}
.src{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-weight:400;letter-spacing:0}
.scene{padding:12px 14px;border-radius:var(--r);background:var(--hero);color:var(--hero-muted);font-family:var(--f-display);font-size:14.5px;line-height:1.7;border-left:2px solid var(--acc)}

/* 付費解鎖 */
.lockmark{font-size:18px;opacity:.8}
.paylist{margin:0;padding-left:20px;text-align:left;font-size:14px;line-height:1.8;color:var(--ink)}
.modal .box .av{align-self:center}

.av img{position:absolute;inset:1.5px;width:calc(100% - 3px);height:calc(100% - 3px);border-radius:50%;object-fit:cover;background:var(--card2)}
.photorow{display:flex;gap:16px;align-items:center}.photorow>div{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
/* 情境劇場 */
.scene-tx p{margin:0 0 6px;line-height:1.85;font-size:calc(var(--read-size) - 2px)}
.scene-tx .w{cursor:pointer}
.scene-ask{margin:0;color:var(--acc-hi);font-family:var(--f-serif,inherit);font-size:calc(var(--read-size) - 1px)}

.cstory .scene-tx p{margin:0 0 12px;line-height:1.95;font-size:var(--read-size)}
.cstory{margin-bottom:16px}

.pkcats{margin-bottom:10px}
.pkcats .tchip small{opacity:.6;margin-left:5px;font-size:11px}

:["p-58.jpg"]}],[11,"依據圖示，當機車故障時，駕駛人應該如何處理？",["A","B","C"],0,"",{"src":"公路局機車圖示題第 59 題","img":["p-59.jpg"]}],[11,"依據圖示，哪個輪胎之胎壓是正常的？",["A","B","C"],2,"",{"src":"公路局機車圖示題第 60 題","img":["p-60.jpg"]}],[12,"身為騎士的您，當左側車輛顯示方向燈欲變換車道或轉彎時，應如何行駛較為安全？",["注意相鄰車輛狀況，預作煞車或減速的準備","按鳴喇叭，促使對方避讓，讓自己前進","只要自己安全無虞，不用理會其他的用路人"],0,"",{"src":"公路局機車危險感知影片題第 001 題","url":"https://space2.thb.gov.tw/d/s/x6B158bsTx3Hlx20WueVCeE1aXHnYEUP/nq4rTikLIfuILf17EUOYwaXYjxOBJkso-bc7gpE5OGgs","vid":"4142"}],[12,"身為騎士的您，行經號誌化路口，當對向有左轉車輛時，應如何行駛較為安全？",["只要注意路口紅綠燈號，綠燈亮起就代表可以通行，無須注意周遭車輛","隨時注意周遭車輛，感知對向車輛可能未依規定轉彎，須預作準備","對向車輛轉彎未依規定顯示方向燈，所以我車要加速通過路口"],1,"",{"src":"公路局機車危險感知影片題第 002 題","url":"https://space2.thb.gov.tw/d/s/x6B16bIhT63RErrDFb854mdxIvdVC6Rh/GUMSNipPeU46Mqrx-2ExmooDc8RxeGU1-dseARjQJHAs","vid":"4143"}],[12,"身為騎士的您，在路口有視線遮蔽之橫向道路有車輛突然駛出時，應如何行駛較為安全？",["騎乘機車時，除注意車前狀況外，也應留意橫向道路車輛的動態","為了阻止對方車輛違規，所以我車要搶先前進，使對方讓道","遇到突然駛出的車輛，要立刻緊急煞車停止，才是安全行為"],0,"",{"src":"公路局機車危險感知影片題第 003 題","url":"https://space2.thb.gov.tw/d/s/x6B18DV6OeSPmvyLpWNGAa0neywjiv3e/FkuTg_O6SI2cgcHqBKr4XFWIGW4VXbnL-AMqgAjgJHAs","vid":"4144"}],[12,"身為騎士的您，看到前方道路右側路外停車場出入口有車輛駛出時，應如何行駛較為安全？",["駕車為了安全，眼睛只能直視前方，不需要注意左右方向道路情況","駕車除了注意前方狀況外，也要注意周圍車輛是否會突然駛出","只要自己安全無虞，看到其他車輛從路旁駛出亦無須理會"],1,"",{"src":"公路局機車危險感知影片題第 004 題","url":"https://space2.thb.gov.tw/d/s/x6B19P1EBOqG2S4PEuLdZrw5l75jmKh1/Mw9b9mfT5me6cwYFcfaVMUyBclpSd2XC-JsqgpToJHAs","vid":"4145"}],[12,"身為騎士的您，看到前方左側車道車輛突然往右變換車道時，應如何行駛較為安全？",["騎乘機車時，除注意車前狀況外，也應留意左右車道車輛的動態","由於所有的用路人都會遵守交通規則，所以我們不須隨時保持警覺","只要自己安全無虞，看到其他車輛從路旁突然衝出都無須理會"],0,"",{"src":"公路局機車危險感知影片題第 005 題","url":"https://space2.thb.gov.tw/d/s/x6B1BAryzCDqojUJ9Cxn0YqcuyE6Jj9A/VJsXLqt4dRObjMf5lK2ZD6D4DeX7qblB-ksqg3TwJHAs","vid":"4146"}],[12,"身為騎士的您，看到前方非號誌路口右方有車輛突然駛出時，應如何行駛較為安全？",["雖然自己是行駛在幹道上，但還是要隨時注意支道車輛動態","行經非號誌路口時，要看雙方道路大小來判斷是否需要停車再開","行經非號誌路口時，如果對方車輛是左方車，就可加速通過"],0,"",{"src":"公路局機車危險感知影片題第 006 題","url":"https://space2.thb.gov.tw/d/s/x6B1CfgnzhCvi9VjgB3CXQKOSsSWhwOW/sNSJBvtUHz--qgvyrWFiCSVBxg_AAVth-OcyAhz8JHAs","vid":"4147"}],[12,"身為騎士的您，看到前方非號誌路口右方有車輛突然駛出時，應如何行駛較為安全？",["應該善用機車短小輕巧的優勢，搶先穿過路口","按鳴喇叭，示警對方避讓，讓我車通過","不論有無交通號誌，都應注意周遭車輛動態"],2,"",{"src":"公路局機車危險感知影片題第 007 題","url":"https://space2.thb.gov.tw/d/s/x6B1EFC1jRba7tKklqgENJrGOuOtRUu7/yzOryCptR6y6m4_5egQ9L3iU0bwEskd1-Ws2A80EJHAs","vid":"4148"}],[12,"身為騎士的您，看到前方行人從暗處行經行人穿越道時，應如何行駛較為妥適？",["機車行近行人穿越道或轉彎時，均應停讓行人優先通行","因為我車行向是綠燈，可按鳴喇叭，促使行人避讓我車前進","由於行人是不依號誌穿越行人穿越道，所以我不用禮讓他"],0,"",{"src":"公路局機車危險感知影片題第 008 題","url":"https://space2.thb.gov.tw/d/s/x6B1FLSXyvjUB9UUWfkq4OhXoUUGgIeW/khhSNcL9kEl2WOo-5nTtnixCBRd8gQOT-ErGAx0QJHAs","vid":"4149"}],[12,"身為騎士的您，當遇到有車輛跨越分向限制線逆向超車時，應如何行駛較為安全？",["以安全駕駛而言，看到後應該立即煞車，不用理會後方來車","以防禦駕駛而言，應預想對向車輛可能跨越中心線，隨時注意","以預防肇事而言，過彎時要按鳴喇叭，讓對向車道注意我車"],1,"",{"src":"公路局機車危險感知影片題第 009 題","url":"https://space2.thb.gov.tw/d/s/x6B1Gr8Av3lEiDn1DgilveiEbzrFJVij/av8K8p9Y0SfHP7VRFIWSh9DZZUUZnmFe-XrFgNkcJHAs","vid":"4150"}],[12,"身為騎士的您，當遇到有車輛跨越分向限制線逆向超車時，應如何行駛較為安全？",["利用機車 ABS 裝置逐漸減速，並往安全方向閃避","保持在固定的車道上行駛，維持適當的速度","利用機車 ABS 裝置逐漸減速，並往車多方向閃避"],0,"",{"src":"公路局機車危險感知影片題第 010 題","url":"https://space2.thb.gov.tw/d/s/x6B1INwCvtU00gDVAq4H7FQhEOcnPYlr/wKkhTOW2Cku4CMpiqR2bzA4Ry3nSdXZz-WcMAg-4JHAs","vid":"4151"}],[12,"身為騎士的您，當發現路旁有車輛使用方向燈欲進入我車行進車道時，應如何行駛較為妥適？",["減速慢行，觀察旁邊車輛動向，並做隨時停車之準備","按鳴喇叭，示警對方車輛立即避讓，以便讓我車通過","只要專心注意前方有無來車即可，不需要禮讓該車通過"],0,"",{"src":"公路局機車危險感知影片題第 011 題","url":"https://space2.thb.gov.tw/d/s/x6B1K4xn4qvb5FE6B0WbTul0lWyuoNi9/RW4LOCRCeTdx-S0-X4m69JDcOF8qTT3W-B8Zg2PoJHAs","vid":"4152"}],[12,"身為騎士的您，當發現前方道路放置有車輛故障標誌時，應如何行駛較為妥適？",["不用管其他用路人行為，我車繼續往前加速繞過行進即可","減速慢行，認知前方可能有故障車輛或事故現場，避免追撞","為了避免惹禍上身，趕快變換車道繞開，並加速離開現場"],1,"",{"src":"公路局機車危險感知影片題第 012 題","url":"https://space2.thb.gov.tw/d/s/x6B1LsevldtCKinNF0Jqai5SxYV67XkR/Y39zfRddkBnK2p5Eo0nyNyTlT4-Ns9cU-6cwAYw8KHAs","vid":"4153"}],[12,"身為騎士的您，當發現前方有球、小孩、行人或其他異物侵入車道時，應如何行駛較為妥適？？",["應鬆開油門減速慢行，並預做隨時停車之準備","按鳴喇叭，遏阻可能追球的小孩或行人撞上我車","只是一顆球或其他異物侵入車道，完全無須理會"],0,"",{"src":"公路局機車危險感知影片題第 013 題","url":"https://space2.thb.gov.tw/d/s/x6B1NsqRBggwXkAIxtIU1lbXpqFZhjnO/TfVc7I9BHR1wmCPMDHcqogYtI99bS6H6-rs5A4hYKHAs","vid":"4154"}],[12,"身為騎士的您，當現場視線不佳或視線昏暗情況下，發現右方有路邊停車，且右側機車為閃避該車而變換行向通過我車前方時，應如何行駛較為安全？",["直接煞車，且不用考慮就往左變換行向，以閃避該機車及路邊停車","應減速慢行，擺頭確認左方無來車，顯示方向燈往左變換車道","直接緊急變換車道，並按鳴喇叭，以避免自己被該機車撞到"],1,"",{"src":"公路局機車危險感知影片題第 014 題","url":"https://space2.thb.gov.tw/d/s/x6B1OoboAaDQZlspArl0QPUWKHSmBLYQ/VAqxwRz18vXfg5TmDGlnwmmryiC-oVmZ-1b2g5h8KHAs","vid":"4155"}],[12,"身為騎士的您，當進入、離開涵洞或隧道時，因光線強度的急遽變化容易造成眩光，應如何行駛較為安全？",["進出涵洞或隧道時，應該要開啟車輛頭燈，減速拉大安全距離，並做隨時停車之準備","光線強度的急遽變化，對於騎士眼睛是沒有影響的，因此可以立刻變換車道或超車","光線強度的急遽變化，會讓騎士眼睛不舒服，因此要立刻在路邊緊急煞車暫停一下"],0,"",{"src":"公路局機車危險感知影片題第 015 題","url":"https://space2.thb.gov.tw/d/s/x6B1QQF1rD49UN6ngSHjhnOZ8BxEBXdI/7DXl76JiH8Xq_XstM5QcDfUTdpdaY9wV-CM-AtyYKHAs","vid":"4156"}],[12,"身為騎士的您，如遇車輛由道路右方車道匯入時，應如何行駛較為安全？",["行經無號誌路口或交岔路段時，應注意周遭車輛動態，避免事故的發生","因光線強弱不會影響騎士眼睛視力，所以不用注意周圍車輛動態","按鳴喇叭，示警對方車輛立即避讓，以便讓我車通過"],0,"",{"src":"公路局機車危險感知影片題第 016 題","url":"https://space2.thb.gov.tw/d/s/x6B1RzbRUWl1RwgsNrfmZlLCJRohC8Ms/EDz6PIQNTE78oO_bzU4hTgrdw6VrYrFC-qr4AfS4KHAs","vid":"4157"}],[12,"身為騎士的您，遇到公車停靠路邊公車站時，應如何行駛較安全?",["減速後先顯示右方向燈，察看右方及後方有無來車後從公車右側超車","減速後在公車後方安全距離停等，待公車起步後保持安全距離再行駛","緊靠公車後方停等，並按鳴喇叭，請公車盡快前行並緊靠公車行駛"],1,"",{"src":"公路局機車危險感知影片題第 017 題","url":"https://space2.thb.gov.tw/d/s/x6B1TCgLPf8HAPNdOw8cKkZed5MVPCfa/iMKiWPcx4i-jbyr4XpaAFn2WP1QXXmCu-Tb_ADjQKHAs","vid":"4158"}],[12,"身為騎士的您，如欲從影片中公車左側繞行，應如何行駛較安全?",["先顯示左方向燈，透過照後鏡及擺頭觀察左方及後方有無來車，判斷安全距離並注意公車動態，確認安全才可超越","機車駕駛人欲超越公車時，須顯示方向燈並注意公車車輛動向後，即可從公車右側超越","注意公車動態，如遇隔壁車道有車輛行駛，可從公車左側在車陣中同車道超越"],0,"",{"src":"公路局機車危險感知影片題第 018 題","url":"https://space2.thb.gov.tw/d/s/x6B1UURcynTGTHouhVr10ny6kt0FUYZ1/rKrs84RFPbCApC39F9UU3dzbEEXgtwiv-kL9gFjoKHAs","vid":"4159"}],[12,"身為騎士的您，於巷弄中應如何行駛較安全?",["依速限規定行駛，不須理會周遭車輛與行人之動向","維持原速度行駛，按鳴喇叭提醒周邊行人有機車行駛，使其自行避讓","依速限規定行駛，並預判周邊人車接下來可能的動向，避免反應不及發生危險"],2,"",{"src":"公路局機車危險感知影片題第 019 題","url":"https://space2.thb.gov.tw/d/s/x6B1Vinhwb302D1WIeC88qrH7w26FmTd/JFhAyJbMhf_Wh3xPVHyqtlhR9jWUSdpk-_8yAIUMKHAs","vid":"4160"}],[12,"身為騎士的您，行駛於巷弄中察覺有行人進入車道時，應如何行駛較安全?",["先減速，繞過行人後駛離","先減速，按鳴喇叭提醒行人避讓","先減速並停等，禮讓行人先行"],2,"",{"src":"公路局機車危險感知影片題第 020 題","url":"https://space2.thb.gov.tw/d/s/x6B1WvjpL7rTFl0yJzNsqdvarJ7QxlNW/fjDqckOXwoNZ9St8Nlmf9BzFRrOuJDPI-Fc5gGEkKHAs","vid":"4161"}],[12,"身為騎士的您，遇影片中路邊停車開車門，應如何行駛較安全?",["提高警覺，與停靠於路邊的汽車保持安全間隔並減速慢行，做好隨時停車之準備","按鳴喇叭，警告汽車駕駛人，並盡快通過","應即變換車道閃避，儘速駛離以免發生碰撞"],0,"",{"src":"公路局機車危險感知影片題第 021 題","url":"https://space2.thb.gov.tw/d/s/x6B1XtCn6hYEMYHDbwIWP61HUhZq6Bcn/x5oUZgOYVQbLB6faZ10i7q-fT71qqEx8-dbggkk4KHAs","vid":"4162"}],[12,"身為騎士的您，遇影片中救護車輛執行任務穿越交岔路口時，應如何行駛較安全?",["減速，閃過救護車並通過路口","救護車闖紅燈，無須避讓停等","聽聞救護車即應減速避讓，不得跟隨疾駛"],2,"",{"src":"公路局機車危險感知影片題第 022 題","url":"https://space2.thb.gov.tw/d/s/x6B1Yzc7TFCtpR1eEIBFvDEwJP3NOBEY/Uum58KJrLVdW83cH5IYochaJu9zm3RBs-L8GA6FQKHAs","vid":"4163"}],[12,"身為騎士的您，如遇行人在公車後方隨意穿越馬路，應如何行駛較安全?",["減速慢行，按鳴喇叭，使行人避讓","減速慢行，並注意行人動態","減速慢行，行人違規所以無須禮讓"],1,"",{"src":"公路局機車危險感知影片題第 023 題","url":"https://space2.thb.gov.tw/d/s/x6B1ad5iUPb6HD1g790Q7cuy2reTvwdG/NVitfCW22C3tcbSbVD3BVrowawSCQZrY-j8QgU2MKHAs","vid":"4164"}],[12,"身為騎士的您，行近路口時見前方車輛煞車燈亮起並遮蔽視線時，應如何行駛較安全?",["先減速，察看左右來車，確認已無來車後再通行","緊貼左方車輛行駛作為屏障可繼續直行","維持原車速度繼續直行"],0,"",{"src":"公路局機車危險感知影片題第 024 題","url":"https://space2.thb.gov.tw/d/s/x6B1bjDQf0umC8Aq5AaiTZMkmsIlLkVP/_IZ2JKliwEc_JCTqbSpNaMvw46k4MHjT-CcZgQWsKHAs","vid":"4165"}],[12,"身為騎士的您，在影片中看到路旁有遊覽車停等，採取哪個行為較不妥適?",["注意路邊停等遊覽車輛動向","受大型車輛遮蔽視線，須注意行人穿越道路","注意路旁停靠遊覽車，維持原速直行"],2,"",{"src":"公路局機車危險感知影片題第 025 題","url":"https://space2.thb.gov.tw/d/s/x6B1dSwDbPfRq3V74Naq3jqQs3n5mMEF/wyTEMyXd2yD8X8AQqScu-Yl35--IeVex-lrsgbnIKHAs","vid":"4166"}],[12,"身為騎士的您，當行經山區彎道時，應如何行駛較安全?",["為順利過彎，壓低重心加速行駛","按鳴喇叭，提醒對向車輛避讓","減速慢行，提前注意彎道對向車輛行駛動態，並避免緊急煞車"],2,"",{"src":"公路局機車危險感知影片題第 026 題","url":"https://space2.thb.gov.tw/d/s/x6B1f01qC9WwgqWWyUh9evUeoSmzkjUd/n9mjEGNQ7w1gL2EQaKexGwrg4mZIa8CB-rsfAnngKHAs","vid":"4167"}],[12,"身為騎士的您，遇前方道路施工，右前方車輛突變換車道時，應如何行駛較安全?",["須注意前方車輛行駛動向，減速慢行以利避讓","加速行駛超越前車，避免影響後方車流","不須理會前方車輛行駛動向，維持原本的速度行駛即可"],0,"",{"src":"公路局機車危險感知影片題第 027 題","url":"https://space2.thb.gov.tw/d/s/x6B1g5Ikxlgy76n9sdWy0Yv5gqnY4voq/QrYYpepE22Qcsf2lwfQLzWw-02ySTA5Q-arygCYAKHAs","vid":"4168"}],[12,"身為騎士的您，遇前方車輛倒車駛入停車格，應如何行駛較安全?",["按鳴喇叭，使前方車輛加速駛入停車格，以免影響後方車流","減速後不顯示方向燈和擺頭察看左右來車，直接變換車道","保持安全距離先行停等，待前方車輛駛入停車格後再繼續行駛"],2,"",{"src":"公路局機車危險感知影片題第 028 題","url":"https://space2.thb.gov.tw/d/s/x6B1hZ7zYUaE2Fid91fRUOWQf8b5RYiR/I5eutWzahsF4iwzDaP5o18hEs6INZx-c-gMKAr4YKHAs","vid":"4169"}],[12,"身為騎士的您，如遇見公車未顯示方向燈即變換車道並右轉，應如何行駛較安全?",["趁公車尚未完全變換車道及轉彎時，顯示右方向燈後，從右側超越公車後直行","應與公車保持安全距離並減速慢行，觀察公車動態後再行駛","察覺公車要變換車道及右轉時，顯示左方向燈後，即可從左側超車"],1,"",{"src":"公路局機車危險感知影片題第 029 題","url":"https://space2.thb.gov.tw/d/s/x6B1iolIj1TkxqdKy57IegRIad5kMXLD/-ajLbpRaXACAL_0YHHSfdS7g7RARW5W2-xbegWo0KHAs","vid":"4170"}],[12,"身為騎士的您，行經影片中的交岔路口欲右轉，遇見公車右轉未顯示方向燈時，應如何行駛較安全?",["與公車保持相同速度，並緊鄰公車右側一起右轉","減速慢行，並與公車保持安全距離間隔，待公車轉彎後再行右轉","顯示左轉方向燈變換車道，自公車左側超越後右轉"],1,"",{"src":"公路局機車危險感知影片題第 030 題","url":"https://space2.thb.gov.tw/d/s/x6B1jzr0jezASnSXfyokLx5IYzLnYZq9/HGe2bOpK1A5-zwEpRkp85Hs8X60HApaU-9cTARZMKHAs","vid":"4171"}],[12,"身為騎士的您，行經交岔路口時，看見機車騎士違規左轉，應如何行駛較安全?",["維持相同速度直接通過路口","按鳴喇叭，示警對方避讓","減速慢行，並做隨時停車之準備"],2,"",{"src":"公路局機車危險感知影片題第 031 題","url":"https://space2.thb.gov.tw/d/s/x6B1kpnbYSGqzJft2JOwNrlQflZtI1Av/0p34vcnxkfWHz_OuK8I_LghjQuoyYYwP-XLnA95gKHAs","vid":"4172"}],[12,"身為騎士的您，如遇見影片中機車騎士違規行駛，應如何行駛較安全?",["減速慢行，觀察該車輛動向並做隨時停車之準備","只要自己沒違規，看到其他車輛違規便無須理會","看到車輛衝出，按鳴喇叭使其避讓，無須做煞停準備"],0,"",{"src":"公路局機車危險感知影片題第 032 題","url":"https://space2.thb.gov.tw/d/s/x6B1mZnyZ4Jcrznzl9E5ilxZYKOyG2dk/g7Coeumq7w-F_okrl5iZR-RL6kKo5O5e-AMdgSJ4KHAs","vid":"4173"}],[12,"身為騎士的您，行經影片中的交岔路口欲左轉時，以下敘述何者錯誤?",["行經路口應減速慢行，左右擺頭觀察道路車輛及行人動向，確保安全後再左轉，並做隨時停車之準備","應距交岔路口 30 公尺前顯示方向燈或手勢，行至交岔路口中心處左轉","在交岔路口 30 公尺前顯示方向燈或手勢後即可轉彎不用減速"],2,"",{"src":"公路局機車危險感知影片題第 033 題","url":"https://space2.thb.gov.tw/d/s/x6B1oHFwIhQEnMteKa0htDyMTH8gGFL7/BVWsIbxSTK2NQ-0cwXGqIyeFSieTYTBG-6MhAxaMKHAs","vid":"4174"}],[12,"身為騎士的您，行駛至影片交岔路口欲左轉時，應如何行駛較安全?",["距交岔路口 30 公尺前顯示方向燈或手勢，確認前後及對向無來車後，無須行駛至路口中心直接左轉，避免影響後方車流","距交岔路口 30 公尺前顯示方向燈或手勢，並減速行駛至交岔路口中心處，確認前後及對向無來車與行人後再左轉","距交岔路口 30 公尺前顯示方向燈或手勢並減速行駛至行人穿越道，察看無來車及行人後即可左轉"],1,"",{"src":"公路局機車危險感知影片題第 034 題","url":"https://space2.thb.gov.tw/d/s/x6B1pvRX8is9SiumCKUXoEsIcXrmma8L/QluNCqSZijtP3IsxGYPqAYDKCZ4z_yZ6-tM1gAsALHAs","vid":"4175"}],[12,"身為騎士的您，行經設有機車待轉區之路口時，應如何行駛較安全?",["先減速，按鳴喇叭示意機車待轉區內之機車退讓","先減速，並注意機車待轉區內之機車","維持原行駛速度，並繞過停等之機車，直接通過路口"],1,"",{"src":"公路局機車危險感知影片題第 035 題","url":"https://space2.thb.gov.tw/d/s/x6B1rWn9ms4akqjVW9iz8mSdFhLW4jaX/w55oIR6lvjdzlrBsYhjWtk3u9g1ndT1J-LL_gccYLHAs","vid":"4176"}],[12,"身為騎士的您，當行駛於彎道上，下列敘述何者為非？",["應有防禦駕駛的觀念，入彎前減速慢行預測接下來的道路可能有障礙物","應加速通過，避免速度過慢遭後車撞擊","應隨時留意對向車道車輛可能會違規跨越分向限制線"],1,"",{"src":"公路局機車危險感知影片題第 036 題","url":"https://space2.thb.gov.tw/d/s/x6B1syLbLHc9uM33gVMIns1K00X4b8o4/PWCvNQoSlcuIfWM1yRrblKiMDXCVAhAL-Q8IAS8wLHAs","vid":"4177"}],[12,"身為騎士的您，遇道路施工修補，應如何因應較為妥適？",["減速慢行通過","迅速靠左行駛閃避障礙物","快速通過，避免阻塞交通"],0,"",{"src":"公路局機車危險感知影片題第 037 題","url":"https://space2.thb.gov.tw/d/s/x6B1uUaPQFv7dHWKRyr8Ti54jL5HDhzm/DmnSd4HUv2RnvnbPKXB9T6iYBBCOrdRt-DLAgf9ELHAs","vid":"4178"}],[12,"身為騎士的您，行駛過程中接獲行動電話，應如何因應較為妥適?",["邊騎車邊接聽，避免漏接重要電話","應先將手機拿起查看來電者，重要電話再接聽","應停靠至路邊安全位置後，熄火再接聽"],2,"",{"src":"公路局機車危險感知影片題第 038 題","url":"https://space2.thb.gov.tw/d/s/x6B1y57wXN1jrAje4ag71vJpXWlaglBJ/LPckA3Js5PRVdraOskRL5NPumWHQyHSz-pbDA59YLHAs","vid":"4179"}],[12,"身為騎士的您，遇前車騎車接聽電話，應做何處置較適當？",["按鳴喇叭，示意對方注意安全","減速慢行並隨時注意前車及左右狀況，確認安全無虞後再超車","拿起手機跟隨拍照蒐證，向警方檢舉"],1,"",{"src":"公路局機車危險感知影片題第 039 題","url":"https://space2.thb.gov.tw/d/s/x6B20uGRoNh13nYiaPeGapRmuyFJ5Stl/9Ds1qvEp9syE1GYhJbgdNUqL5ThRtKMj-0cUghdwLHAs","vid":"4180"}],[12,"身為騎士的您，如綠燈時看到左前方汽車煞車減速，下列敘述何者為非？",["注意紅綠燈狀況後，便可通過路口","可能有人、車或動物等闖入車道，我們應做隨時煞車減速之準備","可能道路路面有異物或施工，我們應減速慢行小心留意"],0,"",{"src":"公路局機車危險感知影片題第 040 題","url":"https://space2.thb.gov.tw/d/s/x6B21jvRV7pHYmqJlrEh6eeNPL4jENnN/3FUZUmVIrhCl6i6xPWInZGlasu8GtXPj-q8aAF-ILHAs","vid":"4181"}],[12,"身為騎士的您，行經號誌化路口時遇左前方汽車遮蔽視線，應如何行駛較為妥適？",["注意本車車道狀況安全後，便可直行通過","視線可能被前車遮蔽，要留意對向來車左轉","綠燈時，本車擁有絕對路權可以直行通過"],1,"",{"src":"公路局機車危險感知影片題第 041 題","url":"https://space2.thb.gov.tw/d/s/x6B22WbdG7KwtAxTlvCzFMrDTnx5BDFv/8ZeKvZwI5CHf85SFp5tRO5MKoMVkIs3z-3bHgyOcLHAs","vid":"4182"}],[12,"身為騎士的您，遇有左方機車超越本車，應如何因應較為妥適？",["應與前方機車保持隨時可煞停之距離","注意前方車輛狀況後，可從左側閃避通過","為避免碰撞，應先按鳴喇叭，示警對方避讓"],0,"",{"src":"公路局機車危險感知影片題第 042 題","url":"https://space2.thb.gov.tw/d/s/x6B23UmalpEgSb3qfPY7o8L2lkMEQ4Td/D-WinwSnyg6GKGyUfq33YWVYZzKXJg9Z-g8ngzewLHAs","vid":"4183"}],[12,"身為騎士的您，在車道中看到左前方車輛煞車減速，下列敘述何者正確？",["注意左前方車輛動向，預作減速煞車準備","靠右行駛加速通過，避開可能危險","按鳴喇叭，提醒左前方車輛後，加速通過"],0,"",{"src":"公路局機車危險感知影片題第 043 題","url":"https://space2.thb.gov.tw/d/s/x6B24WVXZJemfMix1YqF37nXHIKyGhoY/mD1iucbEfxPirjtfHk7Ddf9n6s5S0Wpy-E7MgL_ILHAs","vid":"4184"}],[12,"身為騎士的您，遇前方車輛顯示方向燈隨即右轉，應如何因應較為妥適？",["向左繞行避開危險","直行快速通過","減速慢行，作隨時停車之準備"],2,"",{"src":"公路局機車危險感知影片題第 044 題","url":"https://space2.thb.gov.tw/d/s/x6B25rg0hDRBeMauvGwz9r68koLEzhco/OZmLAlJCK0Ppy-Hwg9aW-ovrBjL372i0-0sYAUZAMHAs","vid":"4185"}],[12,"身為騎士的您，如遇對向車道有機車突然左轉彎駛入加油站時，應如何因應較為妥適？",["隨時注意對向車道車輛動向，預作煞車減速等措施","直行車路權相較轉彎車大，應直行通過","迅速靠左行駛，避免發生車輛碰撞"],0,"",{"src":"公路局機車危險感知影片題第 045 題","url":"https://space2.thb.gov.tw/d/s/x6B26lsaSzA8NGX6z1qBbbfg4hO0VBiu/OcSFv2U2flHVD6yn2UD0NWsNuLVle6_E-QLmAFJoMHAs","vid":"4186"}],[12,"身為騎士的您，行經無號誌路口，遇前方機車煞車燈亮起，應如何因應較為妥適?",["行經無號誌路口時，可能遇有橫向直行車，先到路口者即有優先路權","除了注意前方車輛狀況外，橫向車輛也要注意","遇橫向車道有來車時，左方車應讓右方車先行，故本車不必禮讓"],1,"",{"src":"公路局機車危險感知影片題第 046 題","url":"https://space2.thb.gov.tw/d/s/x6B27wP6DXgj0wMt4ukXKK8RA8FS49pL/63BIWDHvsNuOpRtK6SME82foXjZao0Cg-TsygHqAMHAs","vid":"4187"}],[12,"身為騎士的您，行經閃光號誌路口，遇橫向車道有來車，應如何因應較為妥適?",["遇閃光黃燈號誌，應減速慢行，小心通過","加快速度，直行通過","本車行駛於閃光黃燈號誌之車道，擁有優先路權可以直行通過"],0,"",{"src":"公路局機車危險感知影片題第 047 題","url":"https://space2.thb.gov.tw/d/s/x6B28epK5gHtsXFliRG0DEy0GrE6ZJrf/qowTmCQ1cW_-E4V5qlulEEMMe_oxRJST-uM5AG6cMHAs","vid":"4188"}],[12,"身為騎士的您，行駛在昏暗的道路上，行經閃光號誌路口，以下騎車行為何者較為妥適?",["天色昏暗時，應開啟頭燈，並留意道路上是否有障礙物","注意本車車道狀況安全後，便可直行通過","行經路口遇橫向來車，應按鳴喇叭，使對方避讓"],0,"",{"src":"公路局機車危險感知影片題第 048 題","url":"https://space2.thb.gov.tw/d/s/x6B29DsmffOhNIRZTe1DpXhFszWvB6wQ/uMWugZmC-7Hw8g8yC3Ovo_w7BkN5GcIj--s8gyawMHAs","vid":"4189"}],[12,"身為騎士的您，行經閃光號誌路口，遇前方汽車煞車燈亮起，下列敘述何者為非?",["遇閃光黃燈號誌，應減速慢行，小心通過","除了注意前方狀況外，對向及橫向車輛也要注意","同樣是直行車，左方車應暫停讓右方車先行，故我應禮讓右方車優先通行"],2,"",{"src":"公路局機車危險感知影片題第 049 題","url":"https://space2.thb.gov.tw/d/s/x6B2A4gAsj3aE4QEPSqaDnPe8mYiRIG4/PR7OXLvHf04BQSSzvIzEVwV1sznKgPb9-7spAzeAMHAs","vid":"4190"}],[12,"身為騎士的您，行經閃光號誌路口，如遇前方汽車煞車燈亮起，應該如何因應較為妥適?",["本車行駛於閃光黃燈號誌之車道，擁有優先路權可以直行通過","除了注意前方狀況外，對向及橫向車輛也要注意","行經路口，所有車輛減速時，機車機動性強，可立即催油門搶先通過"],1,"",{"src":"公路局機車危險感知影片題第 050 題","url":"https://space2.thb.gov.tw/d/s/x6B2Aw2lLuL08abkga9kigWZPZrPBo0r/EXdvQgDXYGRMqrBaKiXEa-Qsb945vVRC-uctAWOgMHAs","vid":"4191"}],[12,"身為騎士的您，遇機車未顯示方向燈即駛入本車道，應如何因應較為妥適?",["按鳴喇叭搶快行駛，使對方避讓","減速慢行，並做隨時煞車之準備","為避免碰撞，應從右側閃避通過"],1,"",{"src":"公路局機車危險感知影片題第 051 題","url":"https://space2.thb.gov.tw/d/s/x6B2C9ySfDbOag1cV0nO7uojGvBVT9In/2mgHrI1PkCV1JSBLP_Skd-olWacyIyw2-Fbfgcu4MHAs","vid":"4192"}],[12,"身為騎士的您，遇右側車道汽車煞車燈亮起，應如何因應較為妥適？",["視線遮蔽處可能有人、車或動物等闖入車道，我們應做隨時煞車減速之準備","可能右側汽車準備路邊停車，直行行駛通過即可","迅速靠左行駛，避免與突然闖入車道之車輛碰撞"],0,"",{"src":"公路局機車危險感知影片題第 052 題","url":"https://space2.thb.gov.tw/d/s/x6B2D3bqAr22kTvK1RyjNMJtwSWKZzHG/KS5v_i9kxw0jIkkL_CgobONYKP7nIz2e-dregjPQMHAs","vid":"4193"}],[12,"身為騎士的您，如遇影片左邊快車道車輛顯示方向燈，該如何反應？",["行經路口前應注意快車道車輛動態，預作減速、停車等措施","連續按鳴喇叭，阻止快車道車輛進入","確保自己安全無虞，就可繼續直行"],0,"",{"src":"公路局機車危險感知影片題第 053 題","url":"https://space2.thb.gov.tw/d/s/x6B2F25kot2Orobj7E0iyRlhaWopdeNz/pMqnEPj6wWbDLFzVnAO_d0Ymg6D1-0Ml-ac0A2foMHAs","vid":"4194"}],[12,"身為騎士的您，如遇見影片左邊內車道車輛顯示方向燈，下列何者反應為非？",["只要專心注意前方有無來車即可","注意相鄰車輛狀況，預作煞車準備","除注意車前狀況外，當身旁出現車輛時應留意其動向"],0,"",{"src":"公路局機車危險感知影片題第 054 題","url":"https://space2.thb.gov.tw/d/s/x6B2GhYXldo13e7VIRcD4ZBnu8fK1aoP/bBv5kxMQyfsfbCZVxn542j5RZgXMVW-v--LxAKQMNHAs","vid":"4195"}],[12,"身為騎士的您，於號誌路口起步時應注意事項，下列何者正確？",["只要注意紅綠燈號，綠燈亮起就代表可以通行","看到綠燈亮起要快速通過才不會被後車按鳴喇叭催促","綠燈亮起雖然代表可以通過，但仍應注意是否會有闖紅燈車輛"],2,"",{"src":"公路局機車危險感知影片題第 055 題","url":"https://space2.thb.gov.tw/d/s/x6B2HkhU8QAfjk2IW2Ho1ILffo9WnuYw/HqXrE3H1R6_19qztHw5GDkal8Xv732Ir-e71gDgoNHAs","vid":"4196"}],[12,"身為騎士的您，在路口停等紅燈時，下列何者正確？",["可以利用停等紅燈時查看手機","察看四周是否有新的廣告招牌","起步前左右擺頭，留意是否有違規車輛"],2,"",{"src":"公路局機車危險感知影片題第 056 題"," 上之防火門。"], [4, "防火區劃之牆壁，應突出建築物外牆面多少以上（交接處外牆具同等防火時效且長度 90 公分以上者得免）？", ["50 公分", "90 公分", "100 公分"], 0, "第79條第3項：防火區劃之牆壁，應突出建築物外牆面五十公分以上；但與其交接處之外牆面長度有九十公分以上，且具有同等以上防火時效者，得免突出。"], [4, "非防火構造建築物主要構造為木造等可燃材料者，應按總樓地板面積每多少平方公尺區劃分隔？", ["300 平方公尺", "500 平方公尺", "1,000 平方公尺"], 1, "第81條第1項：主要構造為木造等可燃材料建造者，應按其總樓地板面積每五百平方公尺，以具有一小時以上防火時效之牆壁予以區劃分隔。"], [4, "自地板面起 1.2 公尺以上之室內牆面及天花板均使用耐燃一級材料裝修者，十一層以上得按每多少平方公尺區劃（非 H-2 組）？", ["100 平方公尺", "200 平方公尺", "500 平方公尺"], 1, "第83條第2款：得按每二○○平方公尺範圍內區劃分隔；供 H-2 組使用者，區劃面積得增為四○○平方公尺。"], [4, "防火構造建築物供 A-1 組或 D-2 組之觀眾席使用，無法區劃分隔部分，得如何處理？", ["免設任何區劃", "以一小時以上防火時效之牆壁、防火門窗等與防火構造之樓地板自成一個區劃", "以撒水設備代替區劃"], 1, "第79條之1第1項：建築物使用類組為 A-1 組或 D-2 組之觀眾席部分等，無法區劃分隔部分，以具有一小時以上防火時效之牆壁、防火門窗等防火設備與防火構造之樓地板自成一個區劃者，不受前條第一項之限制。"], [4, "H-2 組之老人福利機構等，其寢室分間牆上之門窗應？", ["無特別限制", "為不燃材料製造或具半小時以上防火時效", "具二小時以上防火時效"], 1, "第86條第1項第3款：護理之家、老人福利機構等，其各防火區劃內之分間牆應以不燃材料建造，寢室之分間牆上之門窗應為不燃材料製造或具半小時以上防火時效。"], [4, "依第88條但書，下列何種情形可不受內部裝修材料表之限制？", ["裝設自動滅火設備及排煙設備", "使用進口裝潢材料", "營業時間在晚上十點以前"], 0, "第88條但書第2款：裝設自動滅火設備及排煙設備者，不受內部裝修材料表之限制（另第1款規定特定情形之區劃或地面層一百平方公尺以下者亦同）。"], [4, "直通樓梯於避難層開向屋外之出入口，寬度與高度分別不得小於？", ["1.0 公尺、1.8 公尺", "1.2 公尺、1.8 公尺", "1.5 公尺、2.0 公尺"], 1, "第90條第2款：直通樓梯於避難層開向屋外之出入口，寬度不得小於一點二公尺，高度不得小於一點八公尺。"], [4, "B-1、B-2、D-1、D-2 組地面層以下之樓層，通達走廊或直通樓梯間之出入口寬度，每 100 平方公尺應為多少？", ["27 公分", "36 公分", "60 公分"], 1, "第91條第2款：地面層以上各樓層之出入口不得小於各該樓層樓地板面積每一○○平方公尺寬二十七公分計算值；地面層以下之樓層，二十七公分應增為三十六公分。"], [4, "A 類、B-1、B-2、B-3 及 D-1 組建築物，自樓面居室任一點至樓梯口之步行距離不得超過？", ["30 公尺", "50 公尺", "70 公尺"], 0, "第93條第1項第2款第1目：建築物用途類組為 A 類、B-1、B-2、B-3 及 D-1 組者，不得超過三十公尺；C 類原則上不得超過七十公尺。"], [4, "依第95條，幾層以上之樓層應自各該層設置二座以上之直通樓梯達避難層或地面？", ["六層", "八層", "十一層"], 1, "第95條第1項：八層以上之樓層及下列建築物，應自各該層設置二座以上之直通樓梯達避難層或地面。"], [4, "依第96條之1，三層以上五層以下防火構造建築物，僅供下列何種用途者，得免受「至少一座安全梯」之限制？", ["百貨商場", "住宅、集合住宅及農舍", "補習班"], 1, "第96條之1第1款：僅供建築物使用類組 D-3、D-4 組或 H-2 組之住宅、集合住宅及農舍使用者，得免受前條第一項第一款限制。"], [4, "特別安全梯之樓梯間與排煙室或陽臺之間所開設之窗戶，應為？", ["固定窗", "推射窗", "橫拉窗"], 0, "第97條第1項第3款第4目：樓梯間與排煙室或陽臺之間所開設之窗戶應為固定窗；管道間之維修孔並不得開向樓梯間。"], [4, "五層以上樓層供 A-1、B-1、B-2 組使用者，屋頂避難平臺面積合計不得小於五層以上最大樓地板面積之？", ["三分之一", "二分之一", "四分之一"], 1, "第99條第1款：屋頂避難平臺應設置於五層以上之樓層，其面積合計不得小於該棟建築物五層以上最大樓地板面積二分之一。"], [4, "第99條之1之區劃，其樓地板面積不得小於同樓層另一區劃樓地板面積之？", ["三分之一", "二分之一", "四分之一"], 0, "第99條之1第2項：前項區劃之樓地板面積不得小於同樓層另一區劃樓地板面積之三分之一。"], [4, "防煙區劃範圍內任一部份至排煙口之水平距離，不得超過？", ["30 公尺", "45 公尺", "60 公尺"], 1, "第101條第1款：區劃範圍內任一部份至排煙口之水平距離，不得超過四十五公尺。"], [4, "特別安全梯排煙室設置可開向戶外之窗戶，面積不得小於？（不兼用時）", ["1 平方公尺", "2 平方公尺", "4 平方公尺"], 1, "第102條第1款：應設置可開向戶外之窗戶，其面積不得小於二平方公尺，二者兼用時，不得小於三平方公尺，並應位於天花板高度二分之一以上範圍內。"], [4, "依第108條，建築物在幾層以上、第十層以下之各樓層，應設置緊急進口？", ["一層", "二層", "三層"], 1, "第108條第1項：建築物在二層以上，第十層以下之各樓層，應設置緊急進口；但面臨道路或寬度四公尺以上之通路，且各層之外牆每十公尺設有窗戶或其他開口者，不在此限。"], [4, "非防火構造建築物，應自基地境界線（後側及兩側）退縮留設淨寬多少以上之防火間隔（鄰接 6 公尺以上道路或永久性空地側除外）？", ["1.5 公尺", "3 公尺", "6 公尺"], 0, "第110條之1第1項：建築物應自基地境界線（後側及兩側）退縮留設淨寬一點五公尺以上之防火間隔；一基地內兩幢建築物間應留設淨寬三公尺以上之防火間隔。"], [4, "依第116條之1，應依第四章之一規定設置各項安全維護裝置者為？", ["供公眾使用建築物之公共空間", "所有住宅之臥室", "僅限政府機關建築物"], 0, "第116條之1：為強化及維護使用安全，供公眾使用建築物之公共空間應依本章規定設置各項安全維護裝置。"], [4, "依第116條之7，各項安全維護裝置應？", ["有備用電源供應，並具有防水性能", "每年更換一次", "僅於夜間啟用"], 0, "第116條之7：各項安全維護裝置應有備用電源供應，並具有防水性能。"], [6, "特定建築物總樓地板面積超過 1,000 平方公尺、2,000 平方公尺以下者，基地臨接道路之長度不得小於？", ["6 公尺", "8 公尺", "10 公尺"], 1, "第119條表：五百平方公尺以下者四公尺；超過五百至一千平方公尺者六公尺；超過一千至二千平方公尺者八公尺；超過二千平方公尺者十公尺。"], [6, "觀眾席主層在避難層以外之樓層，主要出入口前面之門廳深度及淨高應分別為多少以上？", ["3 公尺及 2.5 公尺", "5 公尺及 3 公尺", "6 公尺及 4 公尺"], 1, "第122條第2款第2目：觀眾席主層之主要出入口前面應留設門廳；門廳之長度不得小於第九十條第二款規定出入口之總寬度，且深度及淨高應分別為五公尺及三公尺以上。"], [6, "戲院及演藝場之舞台面積在多少以上者，舞台開口四周應設置防火牆，並於舞台上方設置自動撒水等滅火設備？", ["200 平方公尺", "300 平方公尺", "500 平方公尺"], 1, "第126條：戲院及演藝場之舞台面積在三○○平方公尺以上者，舞台開口之四周應設置防火牆，舞台上方應設置自動撒水或噴霧泡沬等滅火設備及有效之排煙設備。"], [6, "連續式店鋪商場各層樓地板面積在 3,000 平方公尺以下（超過 1,000 平方公尺）者，兩側均有店鋪之通路寬度應為？", ["3 公尺以上", "4 公尺以上", "6 公尺以上"], 1, "第131條表：二百至一千平方公尺者兩側有店鋪之通路三公尺以上；三千平方公尺以下者四公尺以上；超過三千平方公尺者六公尺以上。"], [6, "建築物之汽車出入口不得設於自道路交叉點或截角線轉彎處起點多少以內？", ["5 公尺", "10 公尺", "20 公尺"], 0, "第135條第1款：自道路交叉點或截角線，轉彎處起點，穿越斑馬線、橫越天橋或地下道上下口起五公尺以內。"], [6, "利用汽車昇降機設備者，應按車庫樓地板面積每多少平方公尺以內為一單位裝置昇降機一台？", ["1,000 平方公尺", "1,200 平方公尺", "1,500 平方公尺"], 1, "第138條第3款：利用汽車昇降機設備者，應按車庫樓地板面積每一千二百平方公尺以內為一單位裝置昇降機一台；樓地板應為耐水材料，並應有污水排除設備。"], [7, "供學校使用之建築物，防空避難設備按核定容納使用人數每人多少計算，且居室任一點至最近避難設備步行距離不得超過多少？", ["1 平方公尺；300 公尺", "0.5 平方公尺；200 公尺", "2 平方公尺；500 公尺"], 0, "第141條第1項第2款第2目：按其主管機關核定計畫容納使用人數每人一平方公尺計算，整體規劃附建，且校舍或居室任一點至最近之避難設備步行距離不得超過三百公尺。"], [7, "半地下式避難設備，其露出地面部分應小於天花板高度之？", ["二分之一", "三分之一", "三分之二"], 0, "第144條第5款：半地下式避難設備，其露出地面部分應小於天花板高度二分之一；構造應一律為鋼筋混凝土構造或鋼骨鋼筋混凝土構造。"], [7, "挖土深度在多少以上者，除地質良好不致崩塌者外，應有適當之擋土設備？", ["1.0 公尺", "1.5 公尺", "3.0 公尺"], 1, "第154條第4款：挖土深度在一點五公尺以上者，除地質良好，不致發生崩塌或其周圍狀況無安全之慮者外，應有適當之擋土設備。"], [7, "施工走道及階梯之坡度應為多少以下？", ["20 度", "30 度", "45 度"], 1, "第157條第1款：坡度應為三十度以下，其為十五度以上者應加釘間距小於三十公分之止滑板條，並應裝設適當高度之扶手。"], [8, "每層共同使用之樓梯間、昇降機間之梯廳，其淨深度不得小於？", ["1.5 公尺", "2 公尺", "2.5 公尺"], 1, "第162條第1項第1款：每層共同使用之樓梯間、昇降機間之梯廳，其淨深度不得小於二公尺；其梯廳面積未超過該層樓地板面積百分之十部分，得不計入該層樓地板面積。"], [8, "住宅挑空樓層高度不得超過？", ["4.2 公尺", "6 公尺", "7.2 公尺"], 1, "第164條之1第1項第3款：挑空樓層高度不得超過六公尺，其旁側之未挑空部分上、下樓層高度合計不得超過六公尺；每處面積不得小於十五平方公尺。"], [8, "依第167條之2，建築物設置之直通樓梯，至少應有幾座為無障礙樓梯？", ["一座", "二座", "全部"], 0, "第167條之2：建築物設置之直通樓梯，至少應有一座為無障礙樓梯。"], [8, "固定座椅席位數量 251 至 350 個者，輪椅觀眾席位數量不得少於？", ["三個", "四個", "五個"], 1, "第167條之5表：二百五十一至三百五十個者，輪椅觀眾席位四個。"], [9, "緩衝區二側之連接出入口總寬度均應在多少範圍內，且任一出入口淨寬度不得小於 1.5 公尺？", ["3 公尺以上，6 公尺以下", "2 公尺以上，4 公尺以下", "4 公尺以上，8 公尺以下"], 0, "第181條第2項第2款：連接緩衝區二側之連接出入口，總寬度均應在三公尺以上，六公尺以下，且任一出入口淨寬度不得小於一點五公尺。"], [9, "地下通道地板面高度不等時，應以坡道連接，其坡度應小於？", ["1 比 8", "1 比 10", "1 比 12"], 2, "第184條第2款：地下通道之地板面高度不等時應以坡道連接之，不得設置台階，其坡度應小於一比十二，坡道表面並應作止滑處理。"], [9, "道路範圍內之地下建築物，其頂蓋與地盤面之間距，道路部分不得少於？", ["2 公尺", "3 公尺", "5 公尺"], 1, "第190條：道路、公園廣場等類似用地範圍內之地下建築物，其頂蓋與地盤面之間距由主管建築機關協商訂定，但道路部分不得少於三公尺。"], [9, "地下建築物之頂版、外牆、底版等直接與土壤接觸部份，應採用？", ["輕質混凝土", "水密性混凝土", "高強度預力混凝土"], 1, "第195條：地下建築物之頂版、外牆、底版等直接與土壤接觸部份，應採用水密性混凝土。"], [9, "地下使用單元之隔間、天花板、地下通道、樓梯等之裝修材料及廣告物，均應為？", ["不燃材料", "耐燃二級材料", "耐燃三級材料"], 0, "第204條：地下使用單元之隔間、天花板、地下通道、樓梯等，其底材、表面材之裝修材料及標示設施、廣告物等均應為不燃材料製成者。"], [9, "地下建築物自動撒水設備之水源容量，不得小於多少個撒水頭連續放水 20 分鐘之水量？", ["10 個", "20 個", "30 個"], 2, "第207條第3款：水源容量不得小於三十個撒水頭連續放水二十分鐘之水量。"], [9, "地下通道地板面之水平面，應有平均多少以上之照度？", ["1 勒克斯", "10 勒克斯", "60 勒克斯"], 1, "第214條：地 const STORIES = {"toeic":[{"id":"t1","p":"boss","title":"總裁的試用期契約","text":"{me}拿著一份薄薄的resume（履歷），站在{hesur}氏集團的lobby（大廳），手心全是汗。{ta}只是一名temporary（臨時的）派遣assistant（助理），卻被assign（指派）到全公司最可怕的地方——總裁辦公室。人資經理把一份contract（合約）推到{ta}面前：「三個月probation（試用期），表現不好就走人。總裁{he}最討厭inefficient（沒效率）的人，也最討厭excuse（藉口）。」{mefirst}二話不說sign（簽署）了合約，心想：只要撐過三個月，就能afford（負擔得起）媽媽的medical（醫療的）費用。沒想到第一天，{ta}就把一杯咖啡spill（灑）在{he}的quarterly（季度的）報告上。男人抬起頭，眼神冷得像冰：「{mesur}{mx}，{you}的performance（表現）讓我印象深刻。」\n\n接下來的日子，{mefirst}學會了schedule（安排）十幾場conference（會議）、reserve（預訂）會議室、translate（翻譯）海外client（客戶）的信件，甚至替總裁reschedule（重新安排）被postpone（延後）的appointment（會面）。{ta}發現{he}雖然strict（嚴格的），卻從不blame（責怪）認真做事的人。某天深夜加班，{ta}在整理invoice（發票）時注意到一個discrepancy（不一致）：同一家supplier（供應商）的同一批shipment（貨物）被重複charge（收費）了三次，總金額超過一千萬。{ta}猶豫了很久，最後還是把資料放在總裁桌上。{he}看完沉默許久，第一次用sincere（真誠的）語氣說：「謝謝{you}。這件事，先列為confidential（機密的）。」\n\n一週後，公司正與秦氏集團negotiate（談判）一筆重要的merger（合併案）。董事會上，副總秦昊突然accuse（指控）{mefirst}把proprietary（專有的）財務資料leak（洩漏）給competitor（競爭對手）。他播放一段監視器footage（畫面）：{ta}深夜獨自進出archive（檔案室）。所有executive（主管）都看向{ta}，眼神充滿suspicion（懷疑）。「{you}被dismiss（解雇）了，」秦昊冷笑，「請security（保全）帶{ta}出去。」{mefirst}咬著唇，想要explain（解釋），卻發現{he}一句話也沒說。那一刻，{ta}的心像被撕成了碎片。\n\n{ta}pack（打包）好自己的東西，準備離開。電梯門關上前，一隻手擋住了門。「誰准{you}走了？」{he}喘著氣，手裡拿著一份audit（稽核）報告。原來，他這一週都在investigate（調查）那筆重複付款。系統的log（紀錄）清楚顯示，真正修改帳目的人是秦昊——他deliberately（故意地）製造假的transaction（交易），想在合併案完成前transfer（轉移）資金，再把罪名嫁禍給新來的助理。「我沒有在會議上替{you}defend（辯護），是因為我需要sufficient（充分的）證據，」他低聲說，「讓他再也無法deny（否認）。」\n\n隔天，秦昊因fraud（詐欺）被移送法辦，與秦氏的合併案也正式terminate（終止）。股價不但沒有下跌，反而因為公司transparent（透明的）處理方式而rebound（反彈）。三個月的試用期到了，人資經理把一份新的agreement（協議）交給{mefirst}，上面寫著：正式employee（員工），職稱是總裁特別consultant（顧問）。{mefirst}正要簽名，{he}卻把筆拿走，從口袋裡拿出一個絲絨盒子。「這份合約有一條clause（條款）是我自己加的，」他單膝跪下，「終身commitment（承諾），沒有試用期，也不能cancel（取消）。{me}，{you}願意accept（接受）嗎？」窗外的陽光灑進辦公室，{ta}笑著點頭——這一次，{ta}簽下的，是一輩子的約定。"},{"id":"t2","p":"puppy","title":"實習生的第一份提案","text":"行銷部來了一個新的intern（實習生），叫{he}，笑起來像一隻剛洗完澡的黃金獵犬。他抱著一疊brochure（宣傳手冊）衝到{you}桌前：「前輩！經理說這次的campaign（活動）由我們兩個負責！」{you}看了看budget（預算）表，只有去年的一半。「預算這麼少，怎麼辦？」{hefirst}眼睛一亮：「我們可以找本地的vendor（廠商）合作，用sponsorship（贊助）換曝光！」\n\n接下來兩週，他每天早上都準時出現在{you}桌邊，帶著一杯拿鐵和新的draft（草稿）。他負責contact（聯絡）合作店家，{you}負責analyze（分析）上一季的survey（問卷調查）。數據顯示，年輕顧客最在意的是convenient（方便的）付款方式，而不是discount（折扣）。{hefirst}驚呼：「前輩好厲害！我完全沒注意到！」\n\n提案那天，{hefirst}緊張到聲音發抖，{you}在桌下輕輕碰了碰他的手。他深吸一口氣，把presentation（簡報）講得清清楚楚。經理聽完點頭：「這個proposal（提案）通過了，下個月launch（上線）。」散會後，{hefirst}在走廊上突然轉身，耳朵紅透：「前輩，等活動成功了……可以跟我約會嗎？當作reward（獎勵）。」"},{"id":"t3","p":"yandere","title":"深夜機房的工程師","text":"","paid":true,"n":13},{"id":"t4","p":"senior","title":"學長的面試特訓","text":"","paid":true,"n":13},{"id":"t5","p":"lawyer","title":"律師的合約陷阱","text":"","paid":true,"n":12},{"id":"t6","p":"coach","title":"新人訓練營","text":"","paid":true,"n":9},{"id":"b1","p":"boss","title":"總裁與新來的男秘書","route":"bl","text":"","paid":true,"n":14},{"id":"b6","p":"coach","title":"健身教練的英文簡報","route":"bl","text":"","paid":true,"n":6}],"jlpt":[{"id":"j1","p":"boss","title":"東京分公司的冷面社長","text":"{you}被派到東京分公司，第一天就在電梯裡遇見新上任的社長{he}。他看了{you}的名牌一眼：「新人？明天早上九點有【会議】（かいぎ・會議），【資料】（しりょう・資料）今天之內【準備】（じゅんび・準備）好。」說完頭也不回地走了。\n\n{you}熬夜做好資料，隔天卻因為電車延誤差點【遅刻】（ちこく・遲到）。{you}一路【急いで】（いそいで・趕緊）跑進會議室，社長看了看錶：「還有三十秒。不錯。」會議結束，他把一疊文件交給{you}：「下週去大阪【出張】（しゅっちょう・出差），{you}也一起來。」\n\n大阪的行程很緊湊，晚上回到飯店，社長卻在大廳等{you}。「明天的【予定】（よてい・行程）取消了，」他遞給{you}一張票，「陪我去看【花火】（はなび・煙火）。這是【約束】（やくそく・約定），不准拒絕。」夜空綻放的瞬間，他低聲說：「{you}的日文進步了。……以後也留在我身邊，【必要】（ひつよう・需要）的話，我天天教{you}。」"},{"id":"j2","p":"puppy","title":"便利商店的打工後輩","text":"{you}在東京【留学】（りゅうがく・留學）的第二年，開始在車站前的便利商店【アルバイト】（打工）。新來的後輩{he}，是一個會用全身力氣笑的男生。第一天上班，他就把一箱【荷物】（にもつ・貨物）搬錯地方，【店長】（てんちょう・店長）氣得跳腳。{you}趕緊過去【手伝って】（てつだって・幫忙），他小聲說：「前輩，謝謝……我日文還不太好。」\n\n從那天起，{you}每天下班後都教他日文。他找錯【お釣り】（おつり・找零），{you}教他數錢；他把敬語說反，{you}教他「いらっしゃいませ」要笑著說。有一次他又【間違えた】（まちがえた・弄錯了），客人很生氣，他卻鞠躬道歉得比誰都認真。客人最後反而笑了：「【大丈夫】（だいじょうぶ・沒關係）、【頑張って】（がんばって・加油）ね。」\n\n日檢前一晚，{hefirst}傳訊息給{you}：「前輩，明天考完，可以【一緒に】（いっしょに・一起）去看櫻花嗎？」後面跟著十個小狗貼圖。{you}還沒回覆，他又傳來一句：「……如果我考過 N3，前輩就要答應喔！」"},{"id":"j3","p":"yandere","title":"隔壁房間的宅宅","text":"","paid":true,"n":0},{"id":"j4","p":"senior","title":"圖書館的讀書會","text":"","paid":true,"n":0},{"id":"j5","p":"lawyer","title":"租屋合約與律師","text":"","paid":true,"n":0},{"id":"j6","p":"coach","title":"防災訓練的教官","text":"","paid":true,"n":0},{"id":"b2","p":"puppy","title":"留學宿舍的室友","route":"bl","text":"","paid":true,"n":0}],"moto":[{"id":"m1","p":"boss","title":"總裁的機車特訓","text":"{he}最近迷上重機，卻發現{you}連普通重型機車駕照都還沒考。「明天開始，我親自教{you}，」他把一頂全新的安全帽放在桌上，「【安全帽】（駕駛人與乘客都要戴，並扣緊帽帶）不扣好，不准上車。」\n\n第一堂課在公司地下停車場。他指著路邊的線：「【紅實線】（禁止臨時停車）、【黃實線】（禁止停車，但可臨時停車），連這個都分不清，就別想騎上路。」到了路口，他示範：「【閃光黃燈】（警告，減速接近、小心通過），【閃光紅燈】（停車再開）。記住了嗎？」\n\n考試前一晚，他又抽考{you}：「沒有速限標誌、有劃車道線的路，最高時速？」「【一般道路速限】（無速限標誌時 50 公里）！」「左轉要在多遠前打方向燈？」「【方向燈】（轉彎前 30 公尺顯示）！」他滿意地點頭，「最後一題——喝了酒怎麼辦？」{you}答：「【酒駕標準】（呼氣酒精濃度 0.15 毫克以上不得駕車），喝酒就不騎車。」他終於笑了：「很好。以後有喝酒的場合，我送{you}回家。」"},{"id":"m2","p":"puppy","title":"外送小狗的兩段式左轉","text":"{he}是附近最有名的外送員，每次送餐都笑得像在發光。{you}剛買了第一台機車，他就自告奮勇當{you}的教練。「前輩，看到那個牌子沒有？【兩段式左轉】（先直行到待轉區，再等綠燈前進）！有這個標誌的路口，機車不能直接切到內車道喔！」\n\n他陪{you}繞了好幾圈市區。經過學校時，他放慢速度：「學校、醫院附近要【減速慢行】（注意行人，醫院附近不按喇叭）。」遇到斑馬線上有老奶奶，他立刻停下：「【行人穿越道】（行人優先，車輛應暫停）！」後面的車按喇叭，他回頭比了個抱歉的手勢，還是等老奶奶走完。\n\n下雨那天，{you}煞車太急差點滑倒。{hefirst}把{you}扶穩，一臉緊張：「【前後輪煞車】（同時使用最穩定）！雨天還要拉長【安全距離】（隨時能煞停的距離）！」他把自己的雨衣披到{you}身上，小聲說：「前輩考到駕照以後……可以讓我坐後座嗎？我保證乖乖戴安全帽。」"},{"id":"m3","p":"yandere","title":"宅宅的駕駛模擬器","text":"","paid":true,"n":0},{"id":"m4","p":"senior","title":"學長陪考監理站","text":"","paid":true,"n":0},{"id":"m5","p":"lawyer","title":"律師與車禍和解","text":"","paid":true,"n":0},{"id":"m6","p":"coach","title":"監理站的鐵面考官","text":"","paid":true,"n":0},{"id":"m7","p":"boss","title":"總裁的花束外送","text":"","paid":true,"n":0},{"id":"m8","p":"puppy","title":"小狗學長的急救課","text":"","paid":true,"n":0},{"id":"m9","p":"yandere","title":"他連輪胎都替我檢查了","text":"","paid":true,"n":0},{"id":"m10","p":"senior","title":"雨夜的山路","text":"","paid":true,"n":0},{"id":"m11","p":"lawyer","title":"酒局之後的條款","text":"","paid":true,"n":0},{"id":"m12","p":"coach","title":"監理站的最後一課","text":"","paid":true,"n":0},{"id":"b5","p":"senior","title":"學長的機車後座","route":"bl","text":"","paid":true,"n":0}],"law":[{"id":"l1","p":"lawyer","title":"第八條的定金","text":"{you}的工作室接到一筆大訂單，對方老闆爽快地說：「我先付一萬元定金！」{you}正要收下，{he}從沙發上抬起頭：「等等。{you}知道收了定金代表什麼嗎？」\n\n他慢條斯理地說：「首先，【契約成立】（當事人互相表示意思一致，契約即成立；不一定要書面，民法第 153 條）。其次，如果是{you}這邊出包、無法履約，就要【加倍返還定金】（受定金方可歸責而不能履行，民法第 249 條）。反過來，如果是對方毀約，【定金不得請求返還】（付定金方可歸責而不能履行）。」\n\n對方又提出，尾款要分期，利息年利率 25%。{he}笑了：「【利率上限】（約定年利率超過 16% 的部分無效，民法第 205 條）。」對方臉色一變，說合約裡寫了「若有爭議一律由甲方決定」。「條款太離譜，可能牴觸【公序良俗】（違反者無效，民法第 72 條）；如果是被騙才簽，還可以主張【詐欺撤銷】（因被詐欺而為意思表示，得撤銷，民法第 92 條）。」\n\n送走客人，{you}問他：「如果對方最後都不付錢呢？」「一般債權的【一般時效】（15 年，民法第 125 條），但租金、利息這類是【短期時效】（5 年，民法第 126 條）。」他靠近一步，壓低聲音：「不過，{you}欠我的那頓晚餐，沒有時效。」"},{"id":"l2","p":"puppy","title":"十七歲的打工合約","text":"咖啡店來了一個新的工讀生，是剛滿十七歲的{he}。他拿著一份健身房會員合約衝到{you}面前：「前輩！我剛剛簽了兩年的健身房合約，可是我媽說無效……真的嗎？」\n\n{you}放下杯子：「現在是【成年年齡】（滿 18 歲為成年，民法第 12 條）。你十七歲，屬於【限制行為能力】（滿 7 歲以上的未成年人，民法第 13 條）。這種合約沒有爸媽同意，就是【效力未定】（須經法定代理人承認才生效力，民法第 79 條）。」他眨眨眼：「那我上週買的珍奶也要我媽同意嗎？」「不用，那是【日常生活所必需】（依年齡及身分、日常生活所必需者，民法第 77 條但書），還有別人單純送你東西，屬於【純獲法律上利益】（不需法定代理人允許）。」\n\n隔天他又闖禍了：送外送時撞倒了路邊的盆栽，老闆要他賠。{you}幫他查了查：「【法代連帶】（未成年人有識別能力時，與法定代理人連帶負損害賠償責任，民法第 187 條）。所以你要跟媽媽一起道歉喔。」\n\n晚上打烊，他蹲在門口數零錢，突然抬頭：「前輩，刑法也是十八歲嗎？」「【刑事責任年齡】（未滿 14 歲不罰；14 至 18 歲得減輕其刑，刑法第 18 條）。」他笑出一口白牙：「那我明年就成年了！到時候……我可以自己決定要追誰了吧？」"},{"id":"l3","p":"boss","title":"總裁的遺囑","text":"","paid":true,"n":0},{"id":"l4","p":"yandere","title":"刪除那張照片","text":"","paid":true,"n":0},{"id":"l5","p":"senior","title":"阿嬤的那通電話","text":"","paid":true,"n":0},{"id":"l6","p":"coach","title":"訓練場外的那一拳","text":"","paid":true,"n":0},{"id":"b4","p":"lawyer","title":"我們的結婚登記","route":"bl","text":"","paid":true,"n":0}],"car":[{"id":"c1","p":"boss","title":"總裁的午夜兜風","text":"凌晨一點，{he}開車送{you}回家。路口綠燈亮了，他卻沒有馬上右轉，而是放慢、停下，還往左邊探頭看了一眼。{you}忍不住問：「怎麼了？」「【A柱死角】（車窗前方的柱子會遮住行人，轉彎前要擺頭察看），」他淡淡地說，「剛剛那裡有一個人。」\n\n果然，一位穿深色衣服的行人從柱子後方走上斑馬線。{he}等對方完全走過才起步：「行人穿越道上已經有人在走，車子至少要保持【3公尺】（汽車與行人穿越道上的行人至少保持 3 公尺距離）。」{you}笑他太謹慎，他看了{you}一眼：「還有，把{you}的【安全帶】（駕駛人、前座及小型車後座乘客均應繫妥）繫好。」\n\n快到{you}家時，他提起晚上的應酬：「今天我一滴酒都沒喝。如果駕駛人酒測超標，【同車乘客連坐】（18 歲以上未滿 70 歲的同車乘客也會受罰）——我不會讓{you}因為我被罰。」車停在樓下，他替{you}解開安全帶，聲音低了下來：「如果哪天我喝了，{you}就把我的鑰匙收走。【拒測】（罰鍰 18 萬元、當場移置保管車輛並吊銷駕照）太難看了。」"},{"id":"c2","p":"puppy","title":"小狗的第一次自駕約會","text":"{he}剛考到駕照，第一次開車載{you}出去玩，興奮得出發前繞著車子檢查了三圈：「胎壓、燈光、雨刷都 OK！前輩坐好喔！」\n\n開上山路沒多久，儀表板突然亮起一個紅色溫度計。{hefirst}慌了：「前、前輩，這是什麼？」{you}冷靜地說：「【水溫警示燈】（引擎溫度過高，應儘速找安全處停車熄火，待冷卻再檢查），千萬不要馬上打開水箱蓋，會被熱水噴到。」他乖乖靠邊停車，像被罵的小狗一樣垂著頭。\n\n休息好再上路，後方傳來消防車的警笛聲。{hefirst}立刻打方向燈靠右：「【讓消防車】（應靠右讓路，待其通過後依正常速限行駛，不得尾隨急駛）！」進隧道前，他又自己開了大燈：「【隧道頭燈】（即使隧道內很亮，也要開亮頭燈）——這個我記得！」{you}忍不住誇他，他耳朵一下子紅了：「那……回程換前輩坐副駕，我可以一直開車載前輩嗎？」"},{"id":"c3","p":"yandere","title":"深夜的國道","text":"","paid":true,"n":0},{"id":"c4","p":"senior","title":"學長載你去出差","text":"","paid":true,"n":0},{"id":"c5","p":"lawyer","title":"酒局後的代駕條款","text":"","paid":true,"n":0},{"id":"c6","p":"coach","title":"教官的路口課","text":"","paid":true,"n":0},{"id":"b3","p":"yandere","title":"他只讓我坐副駕","route":"bl","text":"","paid":true,"n":0}]};
const SCENES = {"bldg":[{"s":"{you}第一天到建築師事務所實習，{he}把一份建照圖說丟到桌上：「先從用語開始。圖上寫著『一宗土地』，什麼意思？」","q":"依建築技術規則，「一宗土地」指的是？","o":["地政登記上同一個地號的土地","一幢或二幢以上有連帶使用性之建築物所使用之建築基地","同一位所有權人名下所有相鄰的土地"],"a":1,"e":"第1條第1款：一宗土地指一幢或二幢以上有連帶使用性之建築物所使用之建築基地；但被道路、鐵路或永久性空地分隔者，不視為同一宗土地。","ci":"外婆過世後的第三個月，{you}收到一串生鏽的鑰匙，和一封只有一行字的信：「潮音居，別賣掉它。」\n\n那是海邊小鎮盡頭的一棟老屋。為了把它改建成民宿，{you}走進了鎮上唯一的建築師事務所當實習生。門一推開，{he}正好抬起頭，手裡那份建照圖說「啪」地落在{you}面前：「新來的？那就從看懂這些字開始。」"},{"s":"{he}在基地圖上畫了一條既成道路，把基地切成兩半：「同一個業主、兩棟有連帶使用的房子，中間隔著一條道路。這還算同一宗土地嗎？」","q":"建築基地被道路、鐵路或永久性空地分隔時，依規定？","o":["不視為同一宗土地","仍視為同一宗土地","由建築師自行認定"],"a":0,"e":"第1條第1款但書：建築基地為道路、鐵路或永久性空地等分隔者，不視為同一宗土地。"},{"s":"客戶問{you}：「建築面積跟基地面積有什麼不同？」{he}在旁邊抱著手臂，等{you}先回答。","q":"「建築面積」的定義是？","o":["基地的水平投影面積","建築物外牆中心線或其代替柱中心線以內之最大水平投影面積","各層樓地板面積的總和"],"a":1,"e":"第1條第3款：建築面積為建築物外牆中心線或其代替柱中心線以內之最大水平投影面積；基地的水平投影面積是第2款的「建築基地面積」。"},{"s":"設計圖上，陽臺從外牆中心線突出了 2.5 公尺。{he}挑眉：「這個陽臺，要從哪裡開始算進建築面積？」","q":"陽臺突出外牆中心線超過 2.0 公尺時，依規定如何處理？","o":["整個陽臺都不計入建築面積","整個陽臺都計入建築面積","應自其外緣扣除 2.0 公尺作為中心線"],"a":2,"e":"第1條第3款：陽臺、屋簷及出入口雨遮突出外牆中心線超過2.0公尺，應自其外緣扣除2.0公尺作為中心線；雨遮、花臺突出超過1.0公尺者，自外緣扣除1.0公尺。"},{"s":"業主希望每層的陽臺做大一點。{he}拿出計算機：「陽臺面積可不是想多大就多大。」","q":"每層陽臺面積之和，原則上以不超過多少為限？","o":["建築面積的八分之一（未達 8 平方公尺者得建築 8 平方公尺）","建築面積的四分之一","基地面積的十分之一"],"a":0,"e":"第1條第3款：每層陽臺面積之和，以不超過建築面積八分之一為限，其未達八平方公尺者，得建築八平方公尺。"},{"s":"{he}考{you}一個基本題：「建蔽率，用一句話講給我聽。」","q":"「建蔽率」是指？","o":["總樓地板面積占基地面積之比率","建築面積占基地面積之比率","建築物高度與基地寬度之比"],"a":1,"e":"第1條第4款：建蔽率為建築面積占基地面積之比率；總樓地板面積與基地面積之比則與容積相關。"},{"s":"{you}在計算一棟有地下室和屋突的建築。{he}提醒：「總樓地板面積，要把哪些算進去？」","q":"「總樓地板面積」包括？","o":["只算地面以上各層","只算地面層與地下層","各層包括地下層、屋頂突出物及夾層等樓地板面積之總和"],"a":2,"e":"第1條第7款：總樓地板面積為建築物各層包括地下層、屋頂突出物及夾層等樓地板面積之總和。"},{"s":"基地是一塊斜坡，最高和最低處差了 7 公尺。{he}問：「基地地面要怎麼定？」","q":"基地地面高低相差超過 3 公尺時，依規定？","o":["一律以最低點為基地地面","以每相差三公尺之水平面為該部分基地地面","以最高點與最低點的平均值為基地地面"],"a":1,"e":"第1條第8款：基地地面高低相差超過三公尺，以每相差三公尺之水平面為該部分基地地面。"},{"s":"業主想在屋頂加一個女兒牆。{he}說：「女兒牆太高，就會被算進建築物高度喔。」","q":"女兒牆高度在多少以內，不計入建築物高度？","o":["1.0 公尺","1.5 公尺","2.0 公尺"],"a":1,"e":"第1條第9款第3目：女兒牆高度在一點五公尺以內，不計入建築物高度。"},{"s":"這棟大樓有昇降機通達屋頂。{he}指著屋突：「有電梯上到屋頂的話，屋突可以比較高。」","q":"有昇降機設備通達屋頂之屋頂突出物，高度在多少以內不計入建築物高度（其他條件符合時）？","o":["6 公尺","9 公尺","12 公尺"],"a":1,"e":"第1條第9款第1目：屋頂突出物高度在六公尺以內，或有昇降機設備通達屋頂之屋頂突出物高度在九公尺以內，且水平投影面積符合比例者，不計入建築物高度。","co":"下班時下起雨。{he}撐著傘送{you}回潮音居，屋頂漏下的水，剛好滴在外婆那封信上。\n\n{he}抬頭看了很久，才說：「這個屋頂，我們先從它開始。」"},{"s":"一般建築的屋突面積算超過了，{you}有點慌。{he}問：「非高層建築的屋突水平投影面積，上限是多少？」","q":"非高層建築物之屋頂突出物（第10款第1目）水平投影面積之和，以不超過建築面積多少為限？","o":["百分之十","百分之十二點五（未達 25 平方公尺者得建築 25 平方公尺）","百分之十五"],"a":1,"e":"第1條第9款第1目：屋頂突出物水平投影面積之和，高層建築物以不超過建築面積百分之十五為限，其餘以百分之十二點五為限，未達二十五平方公尺者得建築二十五平方公尺。","ci":"週末，{you}和{he}一起爬上潮音居的屋頂。女兒牆裂了，水塔歪了一邊，就在水塔底座旁，{he}撬出一個生鏽的鐵盒。\n\n盒子很輕。{you}沒有馬上打開，因為{he}先開口了：「要改建，得先知道屋頂上這些東西，哪些算數、哪些不算。」"},{"s":"屋頂要放一座水塔，直接設在屋頂面上。{he}問：「直接放在屋頂面上的水塔，多高以內不算建築物高度？」","q":"水箱、水塔設於屋頂面上，高度在多少以內不計入建築物高度？","o":["2.5 公尺","3.5 公尺","6 公尺"],"a":0,"e":"第1條第9款第2目：水箱、水塔設於屋頂面上高度在二點五公尺以內者，不計入建築物高度。"},{"s":"{he}帶{you}爬上一棟老公寓的頂樓，指著各種東西：「哪一樣不屬於規則所說的『屋頂突出物』？」","q":"下列何者不屬於「屋頂突出物」？","o":["樓梯間、昇降機間","水塔、女兒牆","頂樓加蓋供居住的套房"],"a":2,"e":"第1條第10款：屋頂突出物指突出於屋面之附屬建築物及雜項工作物，如樓梯間、昇降機間、機械房、水塔、水箱、女兒牆、防火牆、煙囪、避雷針等，不包括供居住的居室。"},{"s":"屋頂想做一個景觀用的透空立體構架。{he}笑了：「這種綠建築設施，面積可以不計入屋突。不過有一個總上限。」","q":"第10款第5目之透空遮牆、透空立體構架，與第1目、第6目屋突水平投影面積之和，以不超過建築面積多少為限？","o":["百分之十五","百分之二十","百分之三十"],"a":2,"e":"第1條第10款第5目：本目與第一目及第六目之屋頂突出物水平投影面積之和，以不超過建築面積百分之三十為限。"},{"s":"{he}在剖面圖上比了一下：「從基地地面量到屋簷底面，這段叫什麼？」","q":"自基地地面起至建築物簷口底面或平屋頂底面之高度，稱為？","o":["樓層高度","簷高","地板面高度"],"a":1,"e":"第1條第11款：簷高為自基地地面起至建築物簷口底面或平屋頂底面之高度。"},{"s":"一間挑高客廳，天花板一半高一半低。{he}問：「這間房的天花板高度要怎麼算？」","q":"同一室內天花板高度不同時，天花板高度如何計算？","o":["取最低處","取最高處","以室內樓地板面積除室內容積之商"],"a":2,"e":"第1條第14款：同一室內之天花板高度不同時，以其室內樓地板面積除室內容積之商作天花板高度。"},{"s":"一棟建築的地下層，天花板有四分之三露出地面。{he}問：「這一層還算地下層嗎？」","q":"地下層天花板高度有多少以上在基地地面上者，視為地面層？","o":["二分之一","三分之二","四分之三"],"a":1,"e":"第1條第16款：地下層指地板面在基地地面以下之樓層；但天花板高度有三分之二以上在基地地面上者，視為地面層。"},{"s":"業主想在斜屋頂裡做一個閣樓。{he}提醒：「閣樓做太大，會被當成另一層樓。」","q":"閣樓樓地板面積在建築面積多少以上時，視為另一樓層？","o":["三分之一","二分之一","四分之一"],"a":0,"e":"第1條第17款：閣樓樓地板面積在該建築物建築面積三分之一以上時，視為另一樓層。"},{"s":"店面想做夾層當倉庫。{he}拿出法規：「夾層有兩個門檻，超過任何一個就算另一層。」","q":"同一樓層內夾層面積之和，超過下列何者時視為另一樓 const kindLabel=q=>q.syn?'重點詞':q.t==='tf'?'是非題':'選擇題';

/* ---------- 故事解析 ---------- */
const TERM_RE=/【([^】]+)】（([^）]+)）|([A-Za-z][A-Za-z'’\-]*)（([^）]+)）/g;
const storyCache={};
function parseText(text,p){return fill(text,p).replace(/\r/g,'').split(/\n\s*\n/).map(p=>p.replace(/\n/g,'').trim()).filter(Boolean).map(p=>{const out=[];let last=0;
  p.replace(TERM_RE,(m,a,b,c,d,idx)=>{if(idx>last)out.push(p.slice(last,idx));out.push([(a||c).trim(),(b||d).trim()]);last=idx+m.length;return m});if(last<p.length)out.push(p.slice(last));return out})}
function parseStory(s){const p=getPersona(s.p);const key=s.text.length+'|'+s.text.slice(0,40)+'|'+youW()+meName()+(p?p.name:'');const c=storyCache[s.id];if(c&&c.key===key)return c.paras;const paras=parseText(s.text,p);storyCache[s.id]={key,paras};return paras}
function storyWords(s){const seen=new Set(),out=[];parseStory(s).forEach(p=>p.forEach(x=>{if(typeof x!=='string'){const k=norm(x[0]);if(!seen.has(k)){seen.add(k);out.push(x)}}}));return out}
const stories=()=>(B.stories||[]).filter(s=>!s.route||s.route===route());
const storyById=id=>stories().find(s=>s.id===id);
const storyNo=id=>stories().findIndex(s=>s.id===id)+1;
let termCache=null;
function allTerms(){if(termCache)return termCache;const m={};stories().forEach(s=>storyWords(s).forEach(([w,g])=>{const k=norm(w);if(!m[k])m[k]={w,g,sid:s.id}}));return termCache=m}
const termPool=()=>Object.values(allTerms()).map(t=>[t.w,t.g]);
const isCJK=w=>!isLatin(w);
function firstSentence(s){const p=parseStory(s)[0]||[];const out=[];let len=0;for(const x of p){if(typeof x==='string'){const m=x.match(/^[^。！？]*[。！？」]+/);if(m&&len>24){out.push(m[0]);break}out.push(x);len+=x.length}else{out.push(x);len+=x[0].length}if(len>120)break}return out}
function plainText(s){return parseStory(s).map(p=>p.map(x=>typeof x==='string'?x:x[0]+'（'+x[1]+'）').join('')).join('\n')}
function readMins(s){return Math.max(2,Math.round(plainText(s).length/420))}
function renderSegs(segs,mode,pi){return segs.map((x,i)=>{if(typeof x==='string')return esc(x);const k=norm(x[0]);const sv=P.words[k]?' saved':'';const cj=isCJK(x[0])?' cjk':'';
  const g=mode==='review'?`<span class="g hide" data-reveal role="button" tabindex="0" aria-label="顯示解釋">（${esc(x[1])}）</span>`:`<span class="g">（${esc(x[1])}）</span>`;
  return `<span class="w${sv}${cj}" role="button" tabindex="0" data-k="${esc(k)}" data-p="${pi}" data-i="${i}">${esc(x[0])}</span>${g}`}).join('')}
function contextOf(paras,pi,ii){const p=paras[pi];if(!p)return '';let left='',right='';
  for(let j=ii-1;j>=0;j--){const x=p[j];if(typeof x==='string'){const m=x.match(/[。！？][」]?([^。！？]*)$/);if(m){left=m[1]+left;break}left=x+left}else left=x[0]+left}
  for(let j=ii+1;j<p.length;j++){const x=p[j];if(typeof x==='string'){const m=x.match(/^[^。！？]*[。！？][」]?/);if(m){right+=m[0];break}right+=x}else right+=x[0]}
  const w=p[ii];left=left.replace(/^[」，、\s]+/,'');return `${esc(left)}<span class="w${isCJK(w[0])?' cjk':''}">${esc(w[0])}</span><span class="g">（${esc(w[1])}）</span>${esc(right)}`}
function findOcc(k){for(const s of stories()){const ps=parseStory(s);for(let pi=0;pi<ps.length;pi++)for(let i=0;i<ps[pi].length;i++){const x=ps[pi][i];if(typeof x!=='string'&&norm(x[0])===k)return {s,pi,i}}}return null}

function planOrder(){const ss=stories();if(ss.length){const sc=s=>(s.route?0:2)+(s.p===PS.id?0:1);return ss.slice().sort((x,y)=>sc(x)-sc(y)).map(s=>'s:'+s.id)}return usableUnits().map(u=>'u:'+u.id)}
